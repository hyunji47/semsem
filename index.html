<!doctype html><html><head><meta charset=utf8><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-512.png"><meta name="apple-mobile-web-app-title" content="셈셈"><meta name="apple-mobile-web-app-capable" content="yes"><meta property="og:image" content="icon-512.png"><meta property="og:title" content="셈셈 수학 놀이터"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>셈셈 수학 놀이터</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700&display=swap">
<style>
/* Layout concept: 모눈 연습장 위에 스티커처럼 붙은 두꺼운 외곽선 카드. 홈(학년·단원) → 풀이(키패드) → 결과 */
:root{
  --paper:#F2F8FF; --grid:#D9E8F8; --card:#FFFFFF;
  --ink:#1B2744; --soft:#566685; --edge:#1B2744; --shadow:#1B2744;
  --sun:#FFC93C; --mint:#37C9A0; --sky:#52A8FF; --coral:#FF6F61;
  --sun-t:#FFF1C2; --mint-t:#D3F5E9; --sky-t:#D6EAFF; --coral-t:#FFDAD6;
  --op:#E0463A; --ok:#12805A; --bad:#C23A30; --on:#1B2744;
  --font-d:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-b:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
:root{color-scheme:light}
*{box-sizing:border-box}
body{
  margin:0; color:var(--ink); font-family:var(--font-b); font-size:16px; line-height:1.5;
  background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
}
button{font-family:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--sky); outline-offset:3px}
.wrap{
  max-width:720px; margin:0 auto; padding-block:18px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.screen{animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* mascot */
.mascot{width:72px;height:72px;flex:none;overflow:visible}
.mascot .m-line{stroke:var(--edge);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.mascot .m-body{fill:var(--sky)}
.mascot .m-ball{fill:var(--sun)}
.mascot .m-cheek{fill:var(--coral);opacity:.75}
.mascot .m-eye{fill:var(--on)}
.mascot .m-mouth{fill:none;stroke:var(--on);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.mascot .m-open{fill:var(--coral)}
.mascot .happy-only,.mascot .sad-only{display:none}
.mascot.happy .happy-only{display:inline}
.mascot.happy .calm-only{display:none}
.mascot.sad .sad-only{display:inline}
.mascot.sad .calm-only{display:none}
.mascot.happy{animation:hop .5s ease-out}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-12px)}100%{transform:translateY(0)}}

/* home */
.head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.head h1{font:2.1rem/1.1 var(--font-d);margin:0;text-wrap:balance}
.head p{margin:2px 0 0;color:var(--soft);font-size:.9rem}
.hr{margin-left:auto;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.sndbtn{flex:none;border:3px solid var(--edge);border-radius:999px;background:var(--card);box-shadow:0 3px 0 var(--shadow);padding:2px 12px;font:.85rem/1.5 var(--font-d);color:var(--ink);white-space:nowrap}
.sndbtn[aria-pressed="false"]{background:var(--coral-t);color:var(--soft)}
.total{flex:none;border:3px solid var(--edge);border-radius:999px;background:var(--sun);color:var(--on);
  font:1.1rem/1 var(--font-d);padding:8px 14px;box-shadow:0 3px 0 var(--shadow);white-space:nowrap}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tab{border:3px solid var(--edge);border-radius:20px;background:var(--card);box-shadow:0 5px 0 var(--shadow);
  padding:8px 4px 10px;display:flex;align-items:baseline;justify-content:center;gap:2px;transition:transform .08s,box-shadow .08s}
.tab b{font:2.4rem/1 var(--font-d)}
.tab span{font:1.05rem/1 var(--font-d)}
.tab.on{transform:translateY(3px);box-shadow:0 2px 0 var(--shadow);color:var(--on)}
.g1{--gc:var(--sun);--gt:var(--sun-t)}
.g2{--gc:var(--mint);--gt:var(--mint-t)}
.g3{--gc:var(--sky);--gt:var(--sky-t)}
.tab.on{background:var(--gc)}
.gdesc{margin:14px 2px 4px;color:var(--soft);font-size:.95rem}
.nsel{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:12px 2px 0}
.nsel>span{font:1rem/1 var(--font-d);margin-right:2px}
.nbtn{border:3px solid var(--edge);border-radius:999px;background:var(--card);box-shadow:0 3px 0 var(--shadow);padding:5px 14px;font:1rem/1.3 var(--font-d);color:var(--ink)}
.nbtn.on{background:var(--gc);color:var(--on);transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.bar{flex:1;height:16px;border:2.5px solid var(--edge);border-radius:9px;background:var(--card);overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint);transition:width .3s}
.gh{font:1.05rem/1 var(--font-d);letter-spacing:.06em;margin:22px 2px 10px;display:flex;align-items:center;gap:10px}
.gh::after{content:"";flex:1;height:3px;border-radius:2px;background:var(--grid);background:repeating-linear-gradient(90deg,var(--edge) 0 6px,transparent 6px 12px);opacity:.35}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.ucard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;text-align:left;
  border:3px solid var(--edge);border-radius:20px;background:var(--card);box-shadow:0 5px 0 var(--shadow);padding:12px;
  transition:transform .08s,box-shadow .08s}
.ucard:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shadow)}
.badge{width:54px;height:54px;border:3px solid var(--edge);border-radius:50%;background:var(--gc);color:var(--on);
  display:grid;place-items:center;font:1.7rem/1 var(--font-d)}
.badge.sm{font-size:1.15rem}
.uname{font:1.15rem/1.2 var(--font-d);display:block}
.uex{display:block;color:var(--soft);font-size:.85rem}
.ustars{display:block;margin-top:2px;letter-spacing:.1em;font-size:1rem;line-height:1}
.ustars i{font-style:normal;color:var(--grid);-webkit-text-stroke:1px var(--edge)}
.ustars i.on{color:var(--sun)}
.note{margin:26px 2px 0;color:var(--soft);font-size:.85rem;text-align:center}

/* play */
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.quit{border:3px solid var(--edge);border-radius:14px;background:var(--card);box-shadow:0 3px 0 var(--shadow);padding:6px 12px;font:.95rem/1.2 var(--font-d);white-space:nowrap}
.prog{flex:1;display:flex;gap:4px;min-width:0}
.seg{flex:1;height:14px;border:2.5px solid var(--edge);border-radius:8px;background:var(--card)}
.seg.ok{background:var(--mint)}
.seg.mid{background:var(--sun)}
.seg.bad{background:var(--coral)}
.seg.now{background:var(--sky-t);box-shadow:0 0 0 3px var(--sky)}
.count{font:1rem/1 var(--font-d);white-space:nowrap}
.talk{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bubble{position:relative;flex:1;min-width:0;border:3px solid var(--edge);border-radius:18px;background:var(--card);padding:10px 14px;
  font:1.1rem/1.35 var(--font-d);box-shadow:0 4px 0 var(--shadow)}
.bubble::before{content:"";position:absolute;left:-11px;top:50%;width:16px;height:16px;background:var(--card);
  border-left:3px solid var(--edge);border-bottom:3px solid var(--edge);transform:translateY(-50%) rotate(45deg)}
.stage{border:3px solid var(--edge);border-radius:24px;background:var(--card);box-shadow:0 6px 0 var(--shadow);
  padding:22px 12px;text-align:center;min-height:190px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px}
.expr{font:clamp(2rem,9.5vw,2.9rem)/1.5 var(--font-d);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:0 .2em}
.expr .op{color:var(--op)}
.slots{display:inline-flex;gap:6px;vertical-align:middle}
.slot{width:1.45em;height:1.65em;border:3px dashed var(--edge);border-radius:12px;background:var(--card);color:var(--ink);
  font:inherit;padding:0;display:inline-grid;place-items:center;line-height:1}
.slot.active{border-style:solid;background:var(--sun-t);box-shadow:0 0 0 3px var(--sun)}
.slot.ok{border-style:solid;background:var(--mint-t);box-shadow:none}
.slot.reveal{border-style:solid;background:var(--sun-t);box-shadow:none}
.slot.bad{border-style:solid;background:var(--coral-t);box-shadow:none;animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.objs{display:grid;grid-template-columns:repeat(5,minmax(0,2.5rem));gap:4px;justify-content:center;font-size:clamp(1.5rem,7vw,2rem);line-height:1.2}
.pie{width:min(150px,44vw);height:auto}
.pie path{stroke:var(--edge);stroke-width:3;stroke-linejoin:round}
.pie .pf{fill:var(--coral)} .pie .pe{fill:var(--card)}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 .15em}
.frac>span:first-child{border-bottom:4px solid currentColor;padding:0 .2em .08em;min-width:1em;display:flex;justify-content:center}
.frac>span:last-child{padding-top:.08em}
.frac .slot{font-size:.8em}
.vgrid{--cw:clamp(2.7rem,12vw,3.6rem);display:grid;grid-template-columns:repeat(calc(var(--n) + 1),var(--cw));gap:6px;justify-content:center;font:calc(var(--cw)*.78)/1 var(--font-d)}
.vc{height:var(--cw);display:flex;align-items:center;justify-content:center}
.vc.op{color:var(--op)}
.vline{grid-column:1/-1;height:5px;border-radius:3px;background:var(--ink);margin:2px 0}
.vgrid .slot{width:100%;height:var(--cw);font-size:inherit}
.cmp{display:flex;align-items:center;justify-content:center;gap:14px;font:clamp(2.2rem,11vw,3.4rem)/1.2 var(--font-d)}
.cmp .mid{width:1.3em;height:1.3em;border:3px dashed var(--edge);border-radius:50%;display:grid;place-items:center;color:var(--soft)}
.cmp .mid.done{border-style:solid;background:var(--mint-t);color:var(--ink)}
.mq{font:700 1.2rem/1.65 var(--font-b);max-width:30em;text-wrap:pretty}
.seq{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;font:clamp(1.7rem,8vw,2.4rem)/1.2 var(--font-d)}
.seq span{min-width:1.7em;padding:2px 6px;border:3px solid var(--edge);border-radius:12px;background:var(--paper)}
.seq .q{border-style:dashed;background:var(--sun-t);color:var(--op)}
.eq{font:clamp(2rem,9vw,2.7rem)/1.3 var(--font-d);padding:6px 16px;border:3px dashed var(--edge);border-radius:16px;background:var(--paper)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px;margin-top:18px}
.opt{display:flex;align-items:center;gap:12px;border:3px solid var(--edge);border-radius:16px;background:var(--card);box-shadow:0 4px 0 var(--shadow);
  padding:8px 14px;font:1.45rem/1.2 var(--font-d);color:var(--ink);text-align:left;min-height:54px}
.opt b{flex:none;width:2.1rem;height:2.1rem;border:2.5px solid var(--edge);border-radius:50%;background:var(--sky-t);display:grid;place-items:center;font:1rem/1 var(--font-d)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.opt.bad{background:var(--coral-t);opacity:.6}
.opt.ok{background:var(--mint-t)}
.opt:disabled,.choice:disabled{color:var(--ink)}
.shp{width:min(140px,40vw);height:auto}
.shp polygon,.shp rect,.shp circle{fill:var(--sky-t);stroke:var(--edge);stroke-width:4;stroke-linejoin:round}
.fig{width:min(270px,78vw);height:auto}
.fig rect,.fig circle{fill:var(--sky-t);stroke:var(--edge);stroke-width:4}
.fig line{stroke:var(--op);stroke-width:4;stroke-linecap:round}
.fig circle.dot{fill:var(--op);stroke:none}
.fig text{font:700 16px var(--font-b);fill:var(--ink)}
.shapes{display:grid;grid-template-columns:repeat(6,minmax(0,42px));gap:8px;justify-content:center}
.mini{width:100%;height:auto}
.mini *{stroke:var(--edge);stroke-width:2.5;stroke-linejoin:round}
.mini .c{fill:var(--coral)}.mini .t{fill:var(--sun)}.mini .s{fill:var(--mint)}
.balls{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:22em;padding:10px 14px 12px;border:3px dashed var(--edge);border-radius:22px;background:var(--paper);font-size:2rem;line-height:1.15}
.balls small{flex:0 0 100%;font:700 .8rem/1.2 var(--font-b);color:var(--soft);margin-bottom:2px}
.tbl{border-collapse:separate;border-spacing:6px;font:1.6rem/1 var(--font-d)}
.tbl th{font:700 .95rem/1 var(--font-b);color:var(--soft);padding-right:6px}
.tbl td{min-width:2.3em;padding:10px 6px;border:3px solid var(--edge);border-radius:12px;background:var(--paper)}
.tbl td.q{border-style:dashed;background:var(--sun-t);color:var(--op)}
.bars{display:flex;gap:12px;align-items:flex-end;justify-content:center;min-height:130px}
.bar1{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font:1.1rem/1 var(--font-d)}
.bar1 i{display:block;width:34px;border:3px solid var(--edge);border-radius:8px 8px 0 0;background:var(--mint)}
.hintbox{margin-top:12px;min-height:0}
.hintbtn{border:3px solid var(--edge);border-radius:999px;background:var(--sky-t);box-shadow:0 3px 0 var(--shadow);padding:4px 16px;font:.95rem/1.5 var(--font-d)}
.hinttext{margin:10px 0 0;border:3px dashed var(--edge);border-radius:16px;background:var(--sun-t);padding:10px 14px;text-align:left;font-size:.95rem}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:360px;margin:18px auto 0}
.key{height:58px;border:3px solid var(--edge);border-radius:16px;background:var(--card);box-shadow:0 4px 0 var(--shadow);font:1.7rem/1 var(--font-d);color:var(--ink)}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.key.bk{background:var(--coral-t);font-size:1.3rem}
.key.go{background:var(--mint);color:var(--on);font-size:1.3rem}
.key:disabled{opacity:.4;box-shadow:0 4px 0 var(--shadow)}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.choice{border:3px solid var(--edge);border-radius:18px;background:var(--card);box-shadow:0 4px 0 var(--shadow);padding:10px 4px;
  display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink)}
.choice b{font:2.4rem/1.1 var(--font-d)}
.choice small{font-size:.8rem;color:var(--soft)}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.choice.bad{background:var(--coral-t);opacity:.6}
.choice.ok{background:var(--mint-t)}
.nextbar{margin-top:18px;display:flex;justify-content:center}
.big{border:3px solid var(--edge);border-radius:18px;background:var(--mint);color:var(--on);box-shadow:0 5px 0 var(--shadow);
  padding:12px 32px;font:1.35rem/1.2 var(--font-d);min-width:min(100%,240px)}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shadow)}
.big.alt{background:var(--card);color:var(--ink)}

/* result */
.rcard{position:relative;overflow:hidden;border:3px solid var(--edge);border-radius:28px;background:var(--card);box-shadow:0 6px 0 var(--shadow);
  padding:26px 16px 22px;text-align:center}
.rcard .mascot{width:104px;height:104px;margin:0 auto}
.rcard h2{font:1.9rem/1.2 var(--font-d);margin:8px 0 4px;text-wrap:balance}
.rstars{display:flex;justify-content:center;gap:6px;font-size:3.2rem;line-height:1;margin:6px 0}
.rstars i{font-style:normal;color:var(--grid);-webkit-text-stroke:2px var(--edge)}
.rstars i.on{color:var(--sun);animation:pop .5s backwards}
.rstars i:nth-child(2){animation-delay:.2s}.rstars i:nth-child(3){animation-delay:.4s}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3)}100%{transform:none}}
.rsum{color:var(--soft);margin:0}
.review{list-style:none;margin:16px auto 0;padding:0;max-width:420px;text-align:left;display:grid;gap:6px}
.review li{display:flex;justify-content:space-between;gap:10px;border:2.5px solid var(--edge);border-radius:12px;padding:6px 12px;background:var(--paper);font:1.05rem/1.4 var(--font-d)}
.review em{font:normal .8rem/1.9 var(--font-b);color:var(--soft);white-space:nowrap}
.rbtns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:20px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:10px;height:14px;border-radius:3px;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(520px) rotate(540deg);opacity:.9}}
@media (prefers-reduced-motion:reduce){
  .screen,.mascot.happy,.slot.bad,.rstars i.on,.confetti i{animation:none}
}

[hidden]{display:none!important}
/* ===== v3: intro / grade / app shell / calendar / rewards ===== */
body[data-screen="app"] .wrap{padding-bottom:110px}
.linkbtn{border:0;background:none;color:var(--soft);font:1rem/1.4 var(--font-d);text-decoration:underline;text-underline-offset:4px;padding:6px 10px}

.intro{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;min-height:min(78vh,640px);padding-block:24px}
.intro h1{font:clamp(2.8rem,14vw,4.4rem)/1.02 var(--font-d);margin:0;text-wrap:balance}
.intro .mascot{width:150px;height:150px;animation:bob 2.4s ease-in-out infinite}
.isub{margin:0;color:var(--soft);font-size:1rem;line-height:1.7}
.intro .big{margin-top:8px;min-width:min(100%,260px);font-size:1.5rem}
@keyframes bob{50%{transform:translateY(-10px)}}
.floaty{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.floaty span{position:absolute;font:2.6rem/1 var(--font-d);opacity:.55;animation:drift 5s ease-in-out infinite}
.floaty span:nth-child(3n){color:var(--op)}
.floaty span:nth-child(3n+1){color:var(--sky)}
.floaty span:nth-child(3n+2){color:var(--mint)}
.floaty span:nth-child(2n){animation-delay:-2.2s;font-size:2rem}
@keyframes drift{50%{transform:translateY(-14px) rotate(8deg)}}

.gtitle{font:2.2rem/1.2 var(--font-d);margin:18px 0 4px;text-wrap:balance}
.gsub{margin:0 0 18px;color:var(--soft)}
.gcards{display:grid;gap:14px}
.gcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;text-align:left;border:3px solid var(--edge);border-radius:24px;background:var(--card);box-shadow:0 6px 0 var(--shadow);padding:14px 16px;color:var(--ink);transition:transform .08s,box-shadow .08s}
.gcard:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shadow)}
.gnum{width:76px;height:76px;border:3px solid var(--edge);border-radius:50%;background:var(--gc);color:var(--on);display:grid;place-items:center;font:3rem/1 var(--font-d)}
.gcard b{display:block;font:1.6rem/1.2 var(--font-d)}
.gcard small{display:block;color:var(--soft);font-size:.9rem;line-height:1.45}
.gcard .now{display:inline-block;margin-left:8px;padding:0 10px;border:2.5px solid var(--edge);border-radius:999px;background:var(--sun);color:var(--on);font:.8rem/1.6 var(--font-d);vertical-align:middle}

.ahead{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.ahead .mascot{width:54px;height:54px}
.ht{min-width:0}
.ht b{display:block;font:1.35rem/1.15 var(--font-d)}
.ht small{color:var(--soft);font-size:.85rem}

.coinic{display:inline-grid;place-items:center;width:24px;height:24px;border:2.5px solid var(--edge);border-radius:50%;background:#FFE27A;color:#8A5A00;font-size:.8rem;line-height:1}
.gear{flex:none;width:44px;height:44px;border:3px solid var(--edge);border-radius:50%;background:var(--card);box-shadow:0 3px 0 var(--shadow);display:grid;place-items:center;color:var(--ink)}

.view{display:grid;gap:16px}
.hwcard{border:3px solid var(--edge);border-radius:26px;background:var(--card);box-shadow:0 6px 0 var(--shadow);padding:16px;display:grid;gap:12px}
.hwtop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.hwtop small{color:var(--soft);font:700 .85rem/1.2 var(--font-b);letter-spacing:.04em}
.hwtop h2{font:1.7rem/1.2 var(--font-d);margin:2px 0 0}
.gbadge{flex:none;border:3px solid var(--edge);border-radius:999px;background:var(--gc);color:var(--on);font:1.1rem/1 var(--font-d);padding:7px 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2.5px solid var(--edge);border-radius:999px;padding:1px 10px;font:.9rem/1.6 var(--font-d);color:var(--ink)}

.hwsum{margin:0;color:var(--soft);font-size:.9rem}
.donebox{display:flex;align-items:center;gap:12px;border:3px solid var(--edge);border-radius:18px;background:var(--mint-t);padding:10px 14px}
.donebox .tick{flex:none;width:44px;height:44px;border:3px solid var(--edge);border-radius:50%;background:var(--mint);color:var(--on);display:grid;place-items:center;font:1.6rem/1 var(--font-d)}
.donebox b{display:block;font:1.25rem/1.2 var(--font-d)}

.hwcard .big{width:100%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.stat small{color:var(--soft);font-size:.8rem}
.panelbox{border:3px solid var(--edge);border-radius:22px;background:var(--card);box-shadow:0 5px 0 var(--shadow);padding:14px}
.panelbox h3{font:1.15rem/1.2 var(--font-d);margin:0 0 10px;display:flex;justify-content:space-between;gap:8px}
.panelbox h3 small{font:700 .8rem/1.6 var(--font-b);color:var(--soft)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font:.85rem/1 var(--font-d);color:var(--soft)}
.wd i{width:100%;max-width:44px;aspect-ratio:1;border:2.5px solid var(--edge);border-radius:50%;background:var(--paper);display:grid;place-items:center;font:1rem/1 var(--font-d);font-style:normal;color:var(--ink)}
.wd.done i{background:var(--mint)}

.pbar{height:18px;border:3px solid var(--edge);border-radius:10px;background:var(--paper);overflow:hidden}

.pnote{margin:8px 0 0;color:var(--soft);font-size:.9rem}

.cal{border:3px solid var(--edge);border-radius:24px;background:var(--card);box-shadow:0 6px 0 var(--shadow);padding:14px 10px 12px}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.calhead h2{font:1.5rem/1 var(--font-d);margin:0}
.calnav{width:44px;height:44px;border:3px solid var(--edge);border-radius:50%;background:var(--paper);box-shadow:0 3px 0 var(--shadow);font:1.3rem/1 var(--font-d);color:var(--ink)}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dow{text-align:center;font:.85rem/1.8 var(--font-d);color:var(--soft)}
.cd{aspect-ratio:1/1.05;border:2.5px solid var(--grid);border-radius:12px;background:var(--paper);padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--ink);min-width:0}
.cd b{font:1.05rem/1.1 var(--font-d)}
.cd span{font:700 .68rem/1.1 var(--font-b);white-space:nowrap}
.cd.done{background:var(--mint-t);border-color:var(--ok)}
.cd.done span{color:var(--ok)}
.cd.miss{background:var(--coral-t);border-color:var(--bad)}
.cd.miss span{color:var(--bad)}
.cd.today{background:var(--sun-t);border-color:var(--edge)}
.cd.future,.cd.none{opacity:.6}
.cd.sel{outline:3px solid var(--sky);outline-offset:1px}
.cd.empty{visibility:hidden;border:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:.8rem;color:var(--soft)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;border:2px solid var(--edge);vertical-align:-1px;margin-right:4px}
.detail{border:3px solid var(--edge);border-radius:20px;background:var(--card);box-shadow:0 4px 0 var(--shadow);padding:14px 16px}
.detail h3{font:1.25rem/1.2 var(--font-d);margin:0 0 6px}
.detail p{margin:0 0 8px}
.detail ul{margin:0;padding-left:1.2em;display:grid;gap:2px}
.detail .big{margin-top:6px;width:100%}
.mstars{color:var(--sun);-webkit-text-stroke:1px var(--edge);letter-spacing:.1em}

.balbox{display:flex;align-items:center;gap:14px}
.balbox .coinic{width:56px;height:56px;font-size:1.7rem;border-width:3px}
.balbox b{display:block;font:2.4rem/1 var(--font-d)}
.balbox small{color:var(--soft)}
.tiers{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.tier{border:3px solid var(--edge);border-radius:18px;background:var(--card);padding:10px 4px 8px;text-align:center;display:grid;gap:2px}
.tier .em{font-size:2.2rem;line-height:1.2}
.tier b{font:.95rem/1.2 var(--font-d)}
.tier small{color:var(--soft);font-size:.75rem}
.tier.lock{background:var(--paper);border-style:dashed}
.tier.lock .em{filter:grayscale(1) opacity(.35)}
.inp{width:100%;border:3px solid var(--edge);border-radius:14px;padding:10px 12px;font:500 1.05rem/1.3 var(--font-b);background:var(--card);color:var(--ink)}
.inp:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;margin-bottom:10px}
.frow label{font:1rem/1.2 var(--font-d)}
.goalbtn{margin-top:12px;width:100%}
.big:disabled{opacity:.5;box-shadow:0 5px 0 var(--shadow);cursor:default}
.hist{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:4px;font-size:.9rem;color:var(--soft)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:3px solid var(--edge);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.nb{border:3px solid transparent;border-radius:16px;background:none;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font:.95rem/1.1 var(--font-d);color:var(--soft)}
.nb svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.nb[aria-current="page"]{background:var(--sun);color:var(--on);border-color:var(--edge)}

.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;border:0;background:rgba(10,16,32,.55);padding:0}
.panel{position:relative;width:min(100%,520px);background:var(--card);color:var(--ink);border:3px solid var(--edge);border-radius:26px 26px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px;animation:in .2s ease-out}
.panel h2{font:1.5rem/1.2 var(--font-d);margin:0}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;font:1.1rem/1.2 var(--font-d)}
.sw{min-width:92px;border:3px solid var(--edge);border-radius:999px;background:var(--mint);color:var(--on);box-shadow:0 3px 0 var(--shadow);padding:6px 16px;font:1rem/1.3 var(--font-d)}
.sw[aria-pressed="false"]{background:var(--coral-t);color:var(--soft)}
.panel .big{width:100%;font-size:1.15rem}

.gearsm{flex:none;width:38px;height:38px;border:3px solid var(--edge);border-radius:50%;background:var(--card);box-shadow:0 3px 0 var(--shadow);display:grid;place-items:center;color:var(--ink)}
.gearsm svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.utag{display:inline-block;margin:0 0 10px;border:2.5px solid var(--edge);border-radius:999px;background:var(--sky-t);padding:1px 12px;font:.95rem/1.6 var(--font-d)}

.earn{margin:12px auto 0;max-width:420px;border:3px solid var(--edge);border-radius:20px;background:var(--sun-t);padding:12px 14px}
.earn .amt{display:flex;align-items:center;justify-content:center;gap:10px;font:2.4rem/1 var(--font-d)}
.earn .amt .coinic{width:42px;height:42px;font-size:1.3rem}
.earn ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:2px;font-size:.95rem}
.newsticker{margin-top:10px;border:3px dashed var(--edge);border-radius:14px;background:var(--card);padding:6px 10px;font:1.15rem/1.4 var(--font-d)}
@media (prefers-reduced-motion:reduce){.intro .mascot,.floaty span,.panel{animation:none}}

/* ===== v6: 아이 홈(길 따라가기) · 부모님 화면 ===== */
.hero{display:flex;align-items:center;gap:12px}
.hero .hm .mascot{width:84px;height:84px;animation:bob 2.4s ease-in-out infinite}
.hbub{position:relative;flex:1;min-width:0;border:3px solid var(--edge);border-radius:22px;margin-left:6px;background:var(--card);padding:10px 14px;font:1.25rem/1.35 var(--font-d);text-wrap:balance}
.hbub::before,.hbub::after{content:"";position:absolute;width:0;height:0;border-style:solid;border-color:transparent;transform:none;background:none;margin:0}
.hbub::before{left:-14px;top:50%;margin-top:-10px;border-width:10px 14px 10px 0;border-right-color:var(--edge)}
.hbub::after{left:-9px;top:50%;margin-top:-6px;border-width:6px 10px 6px 0;border-right-color:var(--card)}
.trail{display:flex;align-items:flex-start;justify-content:center;gap:0;padding:6px 0 2px}
.node{flex:none;width:calc((100% - 4*14px)/5);min-width:54px;display:grid;justify-items:center;gap:2px;text-align:center}
.node b{font:1.05rem/1.1 var(--font-d)}
.node small{font:700 .72rem/1.2 var(--font-b);color:var(--soft)}
.orb{width:clamp(46px,13vw,62px);aspect-ratio:1;border:3px solid var(--edge);border-radius:50%;display:grid;place-items:center;font:1.6rem/1 var(--font-d);background:var(--paper);box-shadow:0 4px 0 var(--shadow)}
.node.done .orb{background:var(--mint);color:var(--on)}
.node.cur .orb{background:var(--sun);animation:bob 1.6s ease-in-out infinite}
.node.lock .orb{opacity:.55;border-style:dashed;box-shadow:none}
.nst{font:.8rem/1 var(--font-d);font-style:normal;color:var(--sun);-webkit-text-stroke:1px var(--edge);min-height:.8rem}
.dash{flex:none;width:14px;height:0;margin-top:clamp(23px,6.5vw,31px);border-top:3px dashed var(--edge);opacity:.5}
.big.go{background:var(--sun);font-size:1.45rem;padding-block:14px}
.center{text-align:center}
.panelbox.gate{max-width:360px;margin:30px auto;display:grid;gap:10px}
.panelbox.warn{background:var(--sun-t)}
.earn.small .amt{font-size:1.8rem}
.earn.small .amt .coinic{width:32px;height:32px;font-size:1rem}
.goalcost{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font:1rem/1.2 var(--font-d)}
.goalcost .inp{width:auto}

/* 부모님 화면 */
body[data-screen="parent"] .wrap{max-width:980px}

.un b{display:block;font:1rem/1.25 var(--font-d)}
.un small{color:var(--soft);font-size:.78rem}
.ur small{color:var(--soft);font-size:.75rem}
.pbar.sm{height:12px;border-width:2.5px}

.pill.good{background:var(--mint-t)}.pill.mid{background:var(--sun-t)}.pill.bad{background:var(--coral-t)}.pill.none{background:var(--paper);color:var(--soft)}

function pie(total,k){
  const r=62,c=70;let s='';
  for(let i=0;i<total;i++){
    const a0=-Math.PI/2+i*2*Math.PI/total,a1=-Math.PI/2+(i+1)*2*Math.PI/total;
    s+=`<path class="${i<k?'pf':'pe'}" d="M${c} ${c}L${(c+r*Math.cos(a0)).toFixed(1)} ${(c+r*Math.sin(a0)).toFixed(1)}A${r} ${r} 0 0 1 ${(c+r*Math.cos(a1)).toFixed(1)} ${(c+r*Math.sin(a1)).toFixed(1)}Z"/>`;
  }

  if(Math.random()<.7) return H(sw?`${y} × ${x} = {S}`:`${x} × ${y} = {S}`,prod,{hint});

  let opts=[a,...shuffle(pool.slice(0,7)).slice(0,4)];
  opts=(!o.mix&&opts.every(x=>/^\d+$/.test(x)))?opts.sort((x,y)=>x-y):shuffle(opts);
  if(o.fixed)opts=o.fixed.slice();
  return {layout:'m',q,ans:a,opts,ansText:circ[opts.indexOf(a)]+'번',hint:o.hint||'',visual:o.visual||'',key:o.key,sum:o.sum||`${strip(q)} → ${a}`};
};

 {id:'g1-pattern',g:1,grp:LG,name:'규칙 찾기',badge:'?',ex:'2, 4, 6, □, 10',q:'규칙을 찾아 ?에 들어갈 것을 골라요.',gen:()=>{

 {id:'g1-word',g:1,grp:LG,name:'이야기 수학',badge:'?',ex:'사과 5개 + 3개',q:'이야기를 읽고 답을 골라요.',gen:()=>{

function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function seeded(seed,fn){const o=Math.random;Math.random=mulberry(seed);try{return fn();}finally{Math.random=o;}}

/* 난이도: 같은 단원에서 후보 7개를 만들고 숫자 크기(복잡도)로 줄 세운 뒤 쉬움=아래쪽, 어려움=위쪽에서 고른다 */
const cx=p=>(String(p.sum).match(/\d+/g)||[]).reduce((a,n)=>a+Math.log2(1+(+n)),0);
function pickOne(u,lv,used){
  const c=[];
  for(let i=0;i<30&&c.length<7;i++){
    const p=u.gen(),k=p.key||p.sum;
    if(used.has(k)||c.some(x=>(x.key||x.sum)===k))continue;
    p.u=u;c.push(p);
  }
  if(!c.length){const p=u.gen();p.u=u;return p;}
  c.sort((a,b)=>cx(a)-cx(b));
  const idx=lv===1?Math.min(1,c.length-1):lv===3?Math.max(c.length-2,0):Math.floor(c.length/2);
  const p=c[idx];used.add(p.key||p.sum);return p;
}
function buildSet(u,n=10,lv=2){const used=new Set(),out=[];for(let i=0;i<n;i++)out.push(pickOne(u,lv,used));return out;}
function autoLevel(hw){
  const ks=Object.keys(hw).sort().slice(-3);
  if(!ks.length)return {lv:2,rate:null,n:0};
  const r=ks.reduce((a,k)=>a+hw[k].f/Math.max(1,hw[k].t),0)/ks.length;
  return {lv:r>=.88?3:r<.65?1:2,rate:r,n:ks.length};
}

/* 단원별 가중치: 지금 배우는 단원 3, 앞서 배운 연산 단원(복습) 1, 아직 안 배운 단원 0. 부모 설정으로 '많이'(두 배 이상) · '제외' */
function weights(grade,idx,cfg,cat){
  const focus=PACE[grade][idx][cat],all=UNITS.filter(u=>u.g===grade&&catOf(u)===cat).map(u=>u.id),earlier=[];
  if(cat==='calc')PACE[grade].slice(0,idx).forEach(s=>s.calc.forEach(i=>{if(!earlier.includes(i)&&!focus.includes(i))earlier.push(i);}));
  const w={};
  all.forEach(id=>{w[id]=focus.includes(id)?3:earlier.includes(id)?1:0;});
  Object.entries(cfg.units||{}).forEach(([id,v])=>{
    if(!(id in w))return;
    if(v==='off')w[id]=0;else if(v==='more')w[id]=Math.max(w[id]*2,4);
  });
  if(!Object.values(w).some(x=>x>0))all.forEach(id=>{w[id]=1;});
  return w;
}
function allocate(w,total){
  const ids=Object.keys(w).filter(i=>w[i]>0);
  if(!ids.length||total<=0)return [];
  const S=ids.reduce((a,i)=>a+w[i],0),q=ids.map(i=>w[i]/S*total),a=q.map(Math.floor);
  const rem=total-a.reduce((x,y)=>x+y,0);
  q.map((v,k)=>[k,v-a[k]]).sort((x,y)=>y[1]-x[1]).slice(0,rem).forEach(([k])=>{a[k]++;});
  return ids.map((i,k)=>({u:i,n:a[k]})).filter(x=>x.n>0);
}
function buildPlan(grade,cfg,month,lv){
  const idx=effStepIdx(grade,cfg,month),c=cfg.counts||{};
  const cnt={calc:clampN(c.calc,0,80,40),logic:clampN(c.logic,0,20,5),other:clampN(c.other,0,20,5)};
  if(cnt.calc+cnt.logic+cnt.other<=0)cnt.calc=10;
  const alloc={};
  ['calc','logic','other'].forEach(cat=>{alloc[cat]=allocate(weights(grade,idx,cfg,cat),cnt[cat]);});
  return {idx,lv,cnt,alloc};
}

/* 사진첩 사진 → 긴 변 192px, 비율 그대로 JPEG (문서 용량 제한 때문에 작게) */
async function photoToDataURL(file){
  let src,w,h;
  try{src=await createImageBitmap(file,{imageOrientation:'from-image'});w=src.width;h=src.height;}
  catch(e){
    src=await new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=u;});
    w=src.naturalWidth;h=src.naturalHeight;
  }
  if(!w||!h)throw new Error('size');
  const k=Math.min(1,192/Math.max(w,h)),c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(src,0,0,c.width,c.height);
  let q=.82,url=c.toDataURL('image/jpeg',q);
  while(url.length>45000&&q>.35){q-=.1;url=c.toDataURL('image/jpeg',q);}
  if(url.length>60000)throw new Error('big');
  return url;
}

function remoteDoc(){

function kick(){if(!SYNC.db||!SYNC.canWrite)return;clearTimeout(SYNC.timer);SYNC.timer=setTimeout(flush,1500);}
function jobList(pid){
  return [['progress',()=>SYNC.db.doc('progress/'+pid).set(remoteDoc())],['config',()=>SYNC.db.doc('config/'+pid).set(JSON.parse(JSON.stringify(CFG)))],['prof',()=>SYNC.db.doc('config/profiles').set(JSON.parse(JSON.stringify(PROF)))]];
}
async function flush(){
  if(!SYNC.db||SYNC.busy||!SYNC.canWrite)return;
  SYNC.busy=true;
  for(const [name,fn] of jobList(PID)){
    if(!SYNC.dirty[name]||!SYNC.seen[name])continue;
    if((name==='config'||name==='prof')&&!SYNC.admin)continue;
    SYNC.dirty[name]=false;
    try{await fn();}
    catch(e){
      const c=e&&e.code;
      if(c==='invalid_argument'||c==='revoked'||c==='not_granted'){SYNC.canWrite=false;SYNC.state='readonly';}
      else{SYNC.dirty[name]=true;setTimeout(kick,6000);}
    }
  }
  SYNC.busy=false;
  if(SYNC.canWrite&&(SYNC.dirty.progress||SYNC.dirty.config||SYNC.dirty.prof))kick();
  syncBadge();
}

function onProgressSnap(snap,pid){
  if(pid!==PID)return;

  if(!cached){SYNC.seen.progress=true;SYNC.state=SYNC.canWrite?'live':'readonly';}
  const d=snap.exists?snap.data():null;
  if(d&&(d.t||0)>(DB.t||0)){
    if(document.body.dataset.screen==='play')return;
    adoptProgress(d);try{localStorage.setItem(lk(DBK,PID),JSON.stringify(DB));}catch(e){}
    rerender();

  syncBadge();
}
function onConfigSnap(snap,pid){

  if(d&&(d.t||0)>(CFG.t||0)){
    applyCfg(d);try{localStorage.setItem(lk(CFGK,PID),JSON.stringify(CFG));}catch(e){}

}
function onProfSnap(snap){

  const cached=!!(snap.metadata&&snap.metadata.fromCache);
  if(!cached)SYNC.seen.prof=true;
  const d=snap.exists?snap.data():null;
  if(d&&(d.t||0)>(PROF.t||0)){
    adoptProf(d);try{localStorage.setItem(PROFK,JSON.stringify(PROF));}catch(e){}

/* ===== GitHub 저장소 동기화 (Claude 화면 밖, 예: GitHub 페이지에서 열 때) · 토큰은 이 기기 브라우저에만 저장 ===== */
const GHK='semsem-gh-v1',GHN=/^[A-Za-z0-9_.-]{1,100}$/,GHFILE='data/store.json';
const GH={timer:null,busy:false,at:0,err:'',sha:''};
const gh=()=>{const g=readJSON(GHK);return g&&GHN.test(g.owner||'')&&GHN.test(g.repo||'')&&g.token?g:null;};
const ghUrl=g=>'https://api.github.com/repos/'+g.owner+'/'+g.repo+'/contents/'+GHFILE;
const ghAuth=g=>({'Accept':'application/vnd.github+json','Authorization':'Bearer '+g.token});
function ghHint(e){
  const m=String((e&&e.message)||e||''),c=(m.match(/\b(\d{3})\b/)||[])[1];
  if(c==='401')return '토큰이 올바르지 않거나 만료됐어요 (401)';
  if(c==='403')return '토큰에 쓰기 권한이 없거나 GitHub 호출 한도를 넘었어요 (403)';
  if(c==='404')return '저장소를 찾지 못했거나 토큰에 그 저장소 권한(Contents 읽기/쓰기)이 없어요 (404)';
  if(c==='413'||c==='422')return '저장할 데이터가 너무 크거나 형식이 맞지 않아요 ('+c+')';
  if(/conflict/.test(m))return '다른 기기에서 동시에 저장해서 충돌했어요. 잠시 뒤 다시 시도돼요';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return '네트워크가 끊겼거나 이 화면의 보안 설정이 연결을 막았어요';
  return '알 수 없는 오류: '+m.slice(0,60);
}
function ghText(){
  if(!gh())return '이 기기에만 저장돼요. 다른 기기와 연결하려면 아래에서 GitHub를 연결하세요.';
  if(GH.err)return '⚠️ GitHub 저장 실패: '+GH.err+' · 이 기기에는 저장돼요.';
  if(GH.at)return 'GitHub와 연결됨 · 마지막 동기화 '+new Date(GH.at).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
  return 'GitHub에 연결하는 중…';
}
const b64enc=s=>{let x='';new TextEncoder().encode(s).forEach(c=>x+=String.fromCharCode(c));return btoa(x);};
const b64dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
function ghTrimHw(p){
  if(!p||typeof p!=='object')return p;
  const d=JSON.parse(JSON.stringify(p)),ks=Object.keys(d.hw||{}).sort();
  if(ks.length>400)ks.slice(0,ks.length-400).forEach(k=>{delete d.hw[k];});
  return d;
}
function ghCollect(){
  const kids={};
  PROF.o.forEach(id=>{
    const p=id===PID?DB:readJSON(lk(DBK,id)),c=id===PID?CFG:readJSON(lk(CFGK,id));
    kids[id]={p:p&&typeof p==='object'?ghTrimHw(p):null,c:c&&typeof c==='object'?JSON.parse(JSON.stringify(c)):null};
  });
  return {app:'semsem',v:1,prof:JSON.parse(JSON.stringify(PROF)),kids};
}
const ghSig=o=>JSON.stringify({prof:o.prof,kids:o.kids});
/* 받은 데이터 중 이 기기보다 새로운 것만 받아들인다. 바뀐 게 있으면 true */
function ghApply(rem){
  let ch=false;
  if(!rem||rem.app!=='semsem')return false;
  if(rem.prof&&typeof rem.prof==='object'&&(rem.prof.t||0)>(PROF.t||0)){
    adoptProf(rem.prof);try{localStorage.setItem(PROFK,JSON.stringify(PROF));}catch(e){}
    if(!PROF.list[KIDP]){KIDP=PROF.o[0];try{localStorage.setItem(ACTK,KIDP);}catch(e){}}
    ch=true;
  }
  const kids=rem.kids&&typeof rem.kids==='object'?rem.kids:{};
  PROF.o.forEach(id=>{
    const r=kids[id];if(!r)return;
    const lp=id===PID?DB:readJSON(lk(DBK,id)),lc=id===PID?CFG:readJSON(lk(CFGK,id));
    if(r.p&&typeof r.p==='object'&&(r.p.t||0)>((lp&&lp.t)||0)){
      if(id===PID){adoptProgress(r.p);try{localStorage.setItem(lk(DBK,id),JSON.stringify(DB));}catch(e){}}
      else{try{localStorage.setItem(lk(DBK,id),JSON.stringify(r.p));}catch(e){}}
      ch=true;
    }
    if(r.c&&typeof r.c==='object'&&(r.c.t||0)>((lc&&lc.t)||0)){
      if(id===PID){applyCfg(r.c);try{localStorage.setItem(lk(CFGK,id),JSON.stringify(CFG));}catch(e){}}
      else{try{localStorage.setItem(lk(CFGK,id),JSON.stringify(r.c));}catch(e){}}
      ch=true;
    }
  });
  if(!PROF.list[PID]){PID=PROF.o[0];readLocal(PID);ch=true;}
  return ch;
}
async function ghPull(g){
  const r=await fetch(ghUrl(g)+'?t='+Date.now(),{headers:ghAuth(g),cache:'no-store'});
  if(r.status===404)return null;
  if(!r.ok)throw new Error('pull '+r.status);
  const j=await r.json();let text;
  if(j.content&&j.encoding==='base64')text=b64dec(j.content);
  else{const r2=await fetch(ghUrl(g),{headers:Object.assign({},ghAuth(g),{'Accept':'application/vnd.github.raw+json'}),cache:'no-store'});if(!r2.ok)throw new Error('pull '+r2.status);text=await r2.text();}
  return {sha:j.sha,data:JSON.parse(text)};
}
async function ghPut(g,data,sha){
  const body={message:'셈셈 동기화 '+new Date().toISOString().slice(0,16).replace('T',' ')+' UTC',content:b64enc(JSON.stringify(data))};
  if(sha)body.sha=sha;
  const r=await fetch(ghUrl(g),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghAuth(g)),body:JSON.stringify(body)});
  if(r.status===409||r.status===422)throw new Error('conflict '+r.status);
  if(!r.ok)throw new Error('put '+r.status);
}
function ghSchedule(){
  if(SYNC.db||!gh())return;
  clearTimeout(GH.timer);GH.timer=setTimeout(()=>ghSync(false),3000);
}
async function ghSync(manual){
  const g=gh();if(SYNC.db||!g||GH.busy)return;
  clearTimeout(GH.timer);
  if(document.body.dataset.screen==='play'){GH.timer=setTimeout(()=>ghSync(false),15000);return;}
  GH.busy=true;
  try{
    for(let k=0;k<2;k++){
      const rem=await ghPull(g);
      if(rem&&ghApply(rem.data))rerender();
      const mine=ghCollect();
      if(!rem||ghSig(mine)!==ghSig(rem.data)){
        mine.updatedAt=Date.now();
        try{await ghPut(g,mine,rem&&rem.sha);}catch(e){if(k===0&&/conflict/.test(e.message))continue;throw e;}
      }
      break;
    }
    GH.at=Date.now();GH.err='';
  }catch(e){GH.err=ghHint(e);}
  GH.busy=false;
  syncBadge();
  if(manual||document.body.dataset.screen==='parent'){const m=$('#ghMsg');if(m)m.textContent=ghText();}
}

const AU={ctx:null,bgm:null,timer:null,step:0,next:0,mode:'home'};
function audio(){
  try{
    if(!AU.ctx){
      const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
      AU.ctx=new C();AU.bgm=AU.ctx.createGain();AU.bgm.gain.value=.5;AU.bgm.connect(AU.ctx.destination);

function toneAt(c,f,t,dur,type,vol,dest){
  const o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(dest||c.destination);o.start(t);o.stop(t+dur+.05);
}

  reveal:c=>{tone(c,392,0,.18,'sine',.12);tone(c,330,.16,.28,'sine',.12);},

  sticker:c=>{[659,784,988,1319].forEach((f,i)=>tone(c,f,i*.09,.3,'triangle',.13));},
  stage:c=>{[523,659,784,659,784,1047].forEach((f,i)=>tone(c,f,i*.09,.25,'triangle',.14));},
  fin0:c=>{tone(c,392,0,.2,'sine',.12);tone(c,523,.18,.3,'sine',.12);},

  fin2:c=>{[523,659,784,1047].forEach((f,i)=>tone(c,f,i*.1,.28,'triangle',.15));},

};

const PENT=[0,2,4,7,9];

function bgmTick(){
  const c=AU.ctx;if(!c||!AU.timer)return;
  const p=PAT[AU.mode],spb=60/p.bpm/2;
  while(AU.next<c.currentTime+.35){
    const s=AU.step%32,m=p.mel[s],b=p.bass[s];
    if(m!==null)toneAt(c,pf(261.63,m),AU.next,spb*1.9,p.type,p.mv,AU.bgm);
    if(b!==null)toneAt(c,pf(130.81,b),AU.next,spb*3.6,'sine',.09,AU.bgm);
    AU.next+=spb;AU.step++;
  }
}

  if(r)body=`<p><b>${r.g}학년 숙제 완료!</b></p><ul><li>한 번에 맞힌 문제 ${r.f} / ${r.t}</li><li>다시 풀어 맞힌 문제 ${r.s||0}</li><li>별 <span class="mstars">${'★'.repeat(r.st||0)}${'☆'.repeat(3-(r.st||0))}</span></li><li>${CI} +${r.c+r.b}${r.b?` (연속 보너스 +${r.b} 포함)`:''}</li>${r.sec?`<li>걸린 시간 약 ${Math.max(1,Math.round(r.sec/60))}분</li>`:''}</ul>`;
  else if(st==='today'){
    const P=hasProg(k)?DB.prog:null,n=P?[...P.res].filter(c=>c!=='-').length:0;
    body=n?`<p><b>${n}문제까지 풀었어요.</b></p><button type="button" class="big" data-act="goToday">이어서 하러 가기</button>`:'<p>오늘 숙제를 아직 안 했어요.</p><button type="button" class="big" data-act="goToday">숙제하러 가기</button>';
  }
  else if(st==='rest')body='<p>쉬는 날이에요. (주말·공휴일) 숙제를 안 해도 괜찮아요.</p>';
  else if(st==='miss')body='<p>이 날은 숙제를 하지 않았어요.</p>';
  else if(st==='future')body='<p>아직 오지 않은 날이에요.</p>';
  else body='<p>기록이 없어요.</p>';
  return `<div class="detail"><h3>${dateLabel(k)}</h3>${body}</div>`;
}
function viewCal(){
  const y=S.calY,m=S.calM,dim=new Date(y,m+1,0).getDate(),lead=new Date(y,m,1).getDay();
  let cells='',doneN=0,coins=0;
  for(let i=0;i<lead;i++)cells+='<span class="cd empty" aria-hidden="true"></span>';
  for(let d=1;d<=dim;d++){
    const k=`${y}-${pad2(m+1)}-${pad2(d)}`,st=dayStatus(k),r=DB.hw[k];
    if(r){coins+=r.c+r.b;doneN++;}
    const mark=st==='done'?`+${r.c+r.b}`:st==='today'?'오늘':st==='miss'?'미완료':st==='rest'?'쉬는 날':'';
    cells+=`<button type="button" class="cd ${st}${k===S.sel?' sel':''}" data-day="${k}" aria-label="${m+1}월 ${d}일 ${mark}"><b>${d}</b><span>${mark}</span></button>`;
  }
  return `<div class="cal"><div class="calhead"><button type="button" class="calnav" data-cal="-1" aria-label="이전 달">‹</button><h2>${y}년 ${m+1}월</h2><button type="button" class="calnav" data-cal="1" aria-label="다음 달">›</button></div>
    <div class="calgrid">${DOW.map(d=>`<span class="dow">${d}</span>`).join('')}${cells}</div>
    <div class="legend"><span><i style="background:var(--mint-t)"></i>숙제 완료</span><span><i style="background:var(--coral-t)"></i>미완료</span><span><i style="background:var(--sky-t)"></i>쉬는 날(주말·공휴일)</span></div></div>
  <div class="stats"><div class="stat"><b>${doneN}</b><small>이달 완료</small></div><div class="stat"><b>${coins}</b><small>이달 숙제 코인</small></div><div class="stat"><b>${streakNow()}</b><small>연속 일수</small></div></div>
  ${dayDetail(S.sel||todayKey())}`;
}

/* ===== 풀이 ===== */
const slotBtn=i=>`<button type="button" class="slot" data-i="${i}" aria-label="${i+1}번째 칸"></button>`;
function startUnit(id){
  S.mode='practice';S.unit=UNITS.find(u=>u.id===id);S.probs=buildSet(S.unit,S.n,levelInfo().lv);S.i=0;S.res=[];
  show('play');renderProblem();play('start');
}
function startHomework(){
  const key=todayKey();if(DB.hw[key]||!DB.grade)return;
  const P=ensureProg(),lay=planLayout(P.plan),si=P.stg.length;
  if(si>=lay.length)return completeDay();
  S.mode='hw';S.hwKey=key;S.unit=null;S.all=hwProblems(DB.grade,key,P.plan);S.lay=lay;S.stage=si;
  const L=lay[si];S.probs=S.all.slice(L.from,L.to);S.base=L.from;
  S.res=resArr(P.res).slice(L.from,L.to);
  const nx=S.res.findIndex(r=>!r);
  if(nx<0)return finishStage();
  S.i=nx;
  show('play');renderProblem();play('start');
}
function renderProgress(){
  if(S.probs.length>20){
    const d=S.res.filter(Boolean).length;
    $('#prog').innerHTML=`<div class="bar"><i style="width:${Math.round(d/S.probs.length*100)}%"></i></div>`;
  }else $('#prog').innerHTML=S.probs.map((_,i)=>{const r=S.res[i];const c=r==='first'?'ok':r==='second'?'mid':r==='fail'?'bad':i===S.i?'now':'';return `<i class="seg ${c}"></i>`;}).join('');
  $('#count').textContent=`${S.i+1} / ${S.probs.length}`;
}
function renderProblem(){
  const p=S.probs[S.i];
  S.tries=0;S.locked=false;S.done=false;S.tick=Date.now();
  const n=(p.layout==='c'||p.layout==='m')?0:String(p.ans).length;
  S.step=p.layout==='v'?-1:1;
  S.slots=Array(n).fill('');S.cur=S.step<0?n-1:0;
  let body='';
  if(p.layout==='h'){
    const sl=`<span class="slots">${Array.from({length:n},(_,i)=>slotBtn(i)).join('')}</span>`;
    body=`${p.visual}<div class="expr">${p.tpl.replace('{S}',sl).replace(/([+−×÷])/g,'<span class="op">$1</span>')}</div>`;
  }else if(p.layout==='v'){
    const A=String(p.a),B=String(p.b),cols=Math.max(A.length,B.length,n);
    const row=s=>Array.from({length:cols},(_,i)=>{const j=i-(cols-s.length);return `<span class="vc">${j>=0?s[j]:''}</span>`;}).join('');
    const ansRow=Array.from({length:cols},(_,i)=>i<cols-n?'<span class="vc"></span>':slotBtn(i-(cols-n))).join('');
    body=`<div class="vgrid" style="--n:${cols}"><span class="vc"></span>${row(A)}<span class="vc op">${p.op}</span>${row(B)}<span class="vline"></span><span class="vc"></span>${ansRow}</div>`;
  }else if(p.layout==='m'){
    body=`<div class="mq">${p.q}</div>${p.visual}`;
  }else{
    body=`<div class="cmp"><span>${p.l}</span><span class="mid" id="mid">?</span><span>${p.r}</span></div>`;
  }
  $('#stage').innerHTML=body;
  $('#hintbox').innerHTML=p.hint?`<button type="button" class="hintbtn" id="hintBtn" data-act="hint">힌트 보기</button>`:'';
  $('#inputArea').innerHTML=p.layout==='m'?`<div class="opts">${p.opts.map((o,i)=>`<button type="button" class="opt" data-v="${o}"><b>${circ[i]}</b><span>${/^\d+\/\d+$/.test(o)?frac(...o.split('/')):o}</span></button>`).join('')}</div>`:p.layout==='c'
    ?`<div class="choices">${[['>','왼쪽이 커요'],['=','같아요'],['<','오른쪽이 커요']].map(([s,t])=>`<button type="button" class="choice" data-v="${s}"><b>${s==='>'?'&gt;':s==='<'?'&lt;':s}</b><small>${t}</small></button>`).join('')}</div>`
    :`<div class="keypad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button type="button" class="key" data-k="${d}">${d}</button>`).join('')}<button type="button" class="key bk" data-k="bk" aria-label="지우기">⌫ 지우기</button><button type="button" class="key" data-k="0">0</button><button type="button" class="key go" data-k="ok" id="okKey">확인</button></div>`;
  $('#nextbar').hidden=true;
  $('#utag').textContent=S.mode==='hw'?`${S.stage+1}판 ${S.lay[S.stage].name} · ${p.u.name}`:p.u.name;
  $('#bubble').textContent=p.u.q;
  $('#playMascot').innerHTML=mascot();
  renderProgress();paint();
}
function paint(){
  document.querySelectorAll('#stage .slot').forEach((el,i)=>{
    el.textContent=S.slots[i]||'';
    el.classList.toggle('active',!S.locked&&i===S.cur);
  });
  const ok=$('#okKey');
  if(ok)ok.disabled=S.locked||!S.slots.length||S.slots.some(x=>!x);
}
function press(d){
  if(S.locked||!S.slots.length)return;
  play('tap');
  S.slots[S.cur]=d;
  const nx=S.cur+S.step;if(nx>=0&&nx<S.slots.length)S.cur=nx;
  paint();
}
function back(){
  if(S.locked||!S.slots.length)return;
  play('back');
  if(S.slots[S.cur])S.slots[S.cur]='';
  else{const pv=S.cur-S.step;if(pv>=0&&pv<S.slots.length){S.cur=pv;S.slots[pv]='';}}
  paint();
}
const PRAISE=['정답이에요!','잘했어요!','대단해요!','멋져요!','최고예요!','딱 맞았어요!'];
const RETRY=['앗, 다시 한 번 해볼까요?','거의 다 왔어요! 한 번 더!','괜찮아요, 천천히 다시!'];
function submit(val){
  if(S.locked||S.done)return;
  const p=S.probs[S.i];
  if(String(val)===String(p.ans)){S.res[S.i]=S.tries===0?'first':'second';settle('ok');}
  else{
    S.tries++;
    if(S.tries>=2){S.res[S.i]='fail';settle('reveal');}
    else wrong(val);
  }
}
function wrong(val){
  const p=S.probs[S.i];
  S.locked=true;
  play('wrong');
  $('#bubble').textContent=pick(RETRY);mood($('#playMascot'),'sad');
  if(p.layout==='c'||p.layout==='m'){
    const wb=document.querySelector(`#inputArea [data-v="${val}"]`);
    wb?.classList.add('bad');wb?.setAttribute('disabled','');
    setTimeout(()=>{S.locked=false;},350);
  }else{
    document.querySelectorAll('#stage .slot').forEach(el=>el.classList.add('bad'));
    paint();
    setTimeout(()=>{
      S.slots=S.slots.map(()=>'');S.cur=S.step<0?S.slots.length-1:0;S.locked=false;
      document.querySelectorAll('#stage .slot').forEach(el=>el.classList.remove('bad'));
      paint();
    },750);
  }
}
function settle(kind){
  const p=S.probs[S.i];
  S.locked=true;S.done=true;
  play(kind==='ok'?'ok':'reveal');
  recordUnit(p.u.id,S.res[S.i]);
  if(S.mode==='hw'&&DB.prog){
    const P=DB.prog,now=Date.now();
    setRes(P,S.base+S.i,S.res[S.i]);P.sec+=Math.min(120,(now-S.tick)/1000);
  }
  save();
  if(p.layout==='c'||p.layout==='m'){
    if(p.layout==='c'){const mid=$('#mid');mid.textContent=p.ans;mid.classList.add('done');}
    document.querySelectorAll('#inputArea [data-v]').forEach(b=>{b.setAttribute('disabled','');if(b.dataset.v===p.ans)b.classList.add('ok');});
  }else{
    if(kind==='reveal')S.slots=String(p.ans).split('');
    document.querySelectorAll('#stage .slot').forEach(el=>{el.classList.remove('active','bad');el.classList.add(kind==='ok'?'ok':'reveal');});
    paint();
    document.querySelectorAll('#stage .slot').forEach(el=>el.classList.remove('active'));
    $('#inputArea').innerHTML='';
  }
  $('#bubble').textContent=kind==='ok'?pick(PRAISE):`정답은 ${p.layout==='m'?p.ansText:p.ans}이에요. 다음엔 맞힐 수 있어요!`;
  mood($('#playMascot'),kind==='ok'?'happy':'sad');
  const last=S.i===S.probs.length-1;
  $('#nextBtn').textContent=last?(S.mode==='hw'?`${S.stage+1}판 끝내기 →`:'결과 보기 →'):'다음 문제 →';
  $('#nextbar').hidden=false;
  renderProgress();
  $('#nextBtn').focus({preventScroll:true});
}
function next(){
  if(S.i>=S.probs.length-1)return S.mode==='hw'?finishStage():finishPractice();
  S.i++;renderProblem();
}

const starsRow=n=>`<div class="rstars" aria-label="별 ${n}개">${[1,2,3].map(i=>`<i class="${i<=n?'on':''}">★</i>`).join('')}</div>`;
const missList=(items)=>items.length?`<ul class="review" aria-label="다시 볼 문제">${items.slice(0,8).map(x=>`<li><span>${x.p.sum}</span><em>${x.r==='second'?'다시 풀어서 맞힘':'정답 확인'}</em></li>`).join('')}</ul>${items.length>8?`<p class="pnote">그 밖에 ${items.length-8}문제가 더 있어요.</p>`:''}`:'';
function finishStage(){
  const P=DB.prog,L=S.lay[S.stage],sl=resArr(P.res).slice(L.from,L.to);
  const f=sl.filter(r=>r==='first').length,s2=sl.filter(r=>r==='second').length,stars=starsOf(f,s2,sl.length),c=0;
  P.stg[S.stage]={st:stars,f,s:s2,n:sl.length,c};save();
  if(S.stage>=S.lay.length-1)return completeDay();
  const nx=S.lay[S.stage+1];
  play('fin'+Math.max(1,stars));

  ${pProfiles()}${pGit()}
  <div class="panelbox"><h3>난이도</h3><div class="seg4">${[['auto','자동'],['1','쉬움'],['2','보통'],['3','어려움']].map(([v,t])=>`<button type="button" data-lv="${v}" aria-pressed="${String(CFG.lv)===v}"${dis}>${t}</button>`).join('')}</div>
    <p class="pnote">같은 단원 안에서 숫자가 작은 문제(쉬움) 또는 큰 문제(어려움) 위주로 나와요. ‘자동’은 최근 3일 숙제에서 한 번에 맞힌 비율이 88% 이상이면 한 단계 올리고, 65% 미만이면 내려요.<br>지금 적용: <b>${LV_NAME[li.lv]}</b>${li.auto?(li.rate==null?' (기록이 없어 보통으로 시작)':` (최근 ${li.n}일 ${Math.round(li.rate*100)}%)`):''}</p></div>
  <div class="panelbox"><h3>학교 진도</h3><select id="pPace" class="inp"${dis}>${stepOpts}</select><p class="pnote">지금 배우는 단원이 숙제의 대부분을 차지하고, 앞서 배운 연산 단원은 복습으로 조금 섞여요. 진도는 교과서 단원 순서를 바탕으로 한 대략적인 시기예요. 학교 진도와 다르면 단계를 직접 고르세요.</p></div>
  <div class="panelbox"><h3>하루 문항 수<small>합계 ${tot}문제</small></h3>${cnt('calc','연산',5)}${cnt('logic','사고력',1)}${cnt('other','도형·대수·확률',1)}<p class="pnote">10문제를 한 판으로 나눠요. 연산은 쉬운 문제부터 어려운 문제 순서로 나오고, 마지막 판이 사고력·도형·대수·확률이에요.</p></div>
  <div class="panelbox"><h3>이 설정으로 나올 숙제 미리보기</h3><ul class="plist prev">${prev}</ul><p class="pnote">이미 시작한 오늘 숙제는 바뀌지 않아요. 내일부터(또는 오늘 아직 시작하지 않았다면 바로) 적용돼요.</p></div>
  <div class="panelbox"><h3>부모님 화면 잠금</h3><input id="pPinIn" class="inp" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="${CFG.pin?'새 번호 4자리':'번호 4자리'}" aria-label="잠금 번호"${dis}>
    <div class="rbtns" style="justify-content:flex-start"><button type="button" class="mini-btn" data-act="pinSave"${dis}>${CFG.pin?'번호 바꾸기':'잠금 켜기'}</button>${CFG.pin?`<button type="button" class="mini-btn" data-act="pinOff"${dis}>잠금 끄기</button>`:''}</div>
    <p class="pnote">아이가 실수로 여는 것을 막는 가벼운 잠금이에요. 보안 기능은 아니니, 아이 기기는 ‘참여자’ 권한으로 공유하면 설정은 바꿀 수 없어요.</p></div>
  </div>
  <div class="panelbox wide"><h3>단원별 조절</h3><p class="pnote" style="margin-top:0">‘많이’는 해당 단원을 두 배 이상, ‘제외’는 숙제에서 뺍니다.</p>${unitSec}</div>`;
}
function addProfile(name){
  if(!SYNC.admin||PROF.o.length>=MAXP)return '';
  const id='p'+Date.now().toString(36);
  PROF.list[id]={n:name};PROF.o.push(id);saveProf();return id;
}
function pProfiles(){
  const dis=SYNC.admin?'':' disabled';
  return `<div class="panelbox"><h3>프로필<small>${PROF.o.length}/${MAXP}</small></h3>
   <label class="pnote" for="pName" style="margin:0">지금 보고 있는 프로필 이름 (아이 화면 인사말에 쓰여요)</label>
   <input id="pName" class="inp" type="text" maxlength="10" value="${esc(PROF.list[PID]&&PROF.list[PID].n||'')}" placeholder="예: 민준"${dis}>
   <div class="avpick"><p class="pnote" style="margin:12px 0 8px">프로필 사진</p>
    <div class="avrow">${avHTML(PID,'lg')}<div class="avgrid" role="group" aria-label="캐릭터 고르기">${AVE.map((e,k)=>{const cur=PROF.list[PID]&&PROF.list[PID].a==='e'+k;return `<button type="button" class="avopt${cur?' on':''}" data-av="e${k}" aria-label="캐릭터 ${k+1}" aria-pressed="${cur}" style="background:${AVBG[k]}"${dis}>${e}</button>`;}).join('')}</div></div>
    <div class="rbtns" style="justify-content:flex-start;margin-top:10px"><button type="button" class="mini-btn" data-act="avPhoto"${dis}>📷 사진첩에서 고르기</button>${PROF.list[PID]&&PROF.list[PID].a?'<button type="button" class="mini-btn" data-act="avClear"'+dis+'>기본으로</button>':''}</div>
    <input id="avFile" class="avfile" type="file" accept="image/*" tabindex="-1" aria-hidden="true"${dis}>
    <p class="pnote" id="avMsg" role="status">${S.avMsg?esc(S.avMsg):'사진은 비율 그대로, 원 안에 가운데를 맞춰 보여줘요.'}</p></div>
   ${PROF.o.length<MAXP?`<div class="frow" style="margin-top:12px"><input id="pNewName" class="inp" type="text" maxlength="10" placeholder="새 프로필 이름" aria-label="새 프로필 이름"${dis}><button type="button" class="mini-btn" data-act="addProf"${dis}>추가</button></div>`:''}
   ${PROF.o.length>1?`<button type="button" class="mini-btn" data-act="delProf"${dis} style="margin-top:10px">${S.delArm===PID?'정말 목록에서 뺄까요? 한 번 더 누르세요':'이 프로필 목록에서 빼기'}</button><p class="pnote">목록에서만 빠지고 저장된 기록은 지워지지 않아요.</p>`:''}</div>`;
}
function cfgChanged(){saveCfg();renderParent();}

/* ===== 이벤트 ===== */
/* 부모 화면 입구(버튼 없음): 첫 화면 제목 또는 상단 '○○의 수학 놀이터'를 3초 안에 5번 누르기 (또는 주소 끝에 #parent) */
let _tp=[];
document.addEventListener('click',e=>{
  if(!e.target.closest||!e.target.closest('#intro h1,#appHead .ht'))return;
  const n=Date.now();_tp=_tp.filter(t=>n-t<3000).concat(n);
  if(_tp.length>=5){_tp=[];location.hash='parent';}
});
function route(){
  if(location.hash==='#parent'){renderParent();show('parent');return true;}
  return false;
}
window.addEventListener('hashchange',()=>{
  if(location.hash==='#parent'){closeSheet();renderParent();show('parent');}
  else if(document.body.dataset.screen==='parent'){leaveParent();}
});
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(!AU.ctx){audio();if(PREF.bgm)bgmStart();}
  const act=t.dataset.act;
  if(t.dataset.tab){setTab(t.dataset.tab);}
  else if(t.dataset.stk!==undefined){openSticker(+t.dataset.stk);}
  else if(t.dataset.th){setTheme(t.dataset.th==='base'?'':t.dataset.th);renderSheet();play('tap');}
  else if(t.dataset.av){if(SYNC.admin){setAvatar(PID,t.dataset.av);S.avMsg='';renderParent();play('tap');}}
  else if(t.dataset.pf){
    if(document.body.dataset.screen==='parent'){S.delArm='';loadProfile(t.dataset.pf);renderParent();}
    else{setKid(t.dataset.pf);play('start');DB.grade?enterApp('today'):toGrades();}
  }
  else if(t.dataset.g){
    DB.grade=+t.dataset.g;if(!DB.start)DB.start=todayKey();save();
    closeSheet();play('start');enterApp('today');
  }
  else if(t.dataset.unit){startUnit(t.dataset.unit);}
  else if(t.dataset.n){S.n=+t.dataset.n;play('tap');renderApp();}
  else if(t.dataset.cal){
    let m=S.calM+ +t.dataset.cal,y=S.calY;if(m<0){m=11;y--;}else if(m>11){m=0;y++;}
    S.calM=m;S.calY=y;play('tap');renderApp();
  }
  else if(t.dataset.day){S.sel=t.dataset.day;play('tap');renderApp();}
  else if(t.dataset.k!==undefined){
    const k=t.dataset.k;
    if(k==='bk')back();else if(k==='ok'){if(!t.disabled)submit(S.slots.join(''));}else press(k);
  }
  else if(t.dataset.i!==undefined){if(!S.locked){S.cur=+t.dataset.i;paint();}}
  else if(t.dataset.v!==undefined&&!t.dataset.uo){submit(t.dataset.v);}
  else if(t.dataset.ptab){S.ptab=t.dataset.ptab;renderParent();}
  else if(t.dataset.lv){CFG.lv=t.dataset.lv;cfgChanged();}
  else if(t.dataset.cnt){
    const k=t.dataset.cnt,lim={calc:[0,80],logic:[0,20],other:[0,20]}[k];
    CFG.counts[k]=Math.max(lim[0],Math.min(lim[1],CFG.counts[k]+ +t.dataset.d));cfgChanged();
  }
  else if(t.dataset.uo){
    if(t.dataset.uo==='auto')delete CFG.units[t.dataset.u];else CFG.units[t.dataset.u]=t.dataset.uo;
    cfgChanged();
  }
  else if(act){
    switch(act){
      case 'start':play('start');if(PROF.o.length>1&&!KIDCHOSEN)toProfiles();else DB.grade?enterApp('today'):toGrades();break;
      case 'closeStk':closeStk();break;
      case 'ghSave':ghSave();break;
      case 'ghClear':ghClear();break;
      case 'ghEdit':S.ghEdit=true;S.ghMsg='';renderParent();break;
      case 'ghNow':{const m=$('#ghMsg');if(m)m.textContent='동기화 중…';ghSync(true);break;}
      case 'avPhoto':{const f=$('#avFile');if(f)f.click();break;}
      case 'avClear':if(SYNC.admin){setAvatar(PID,'');S.avMsg='';renderParent();}break;
      case 'toProfiles':closeSheet();play('tap');toProfiles();break;
      case 'addProfKid':{
        const v=(($('#newProfName')||{}).value||'').trim().slice(0,10);
        if(!v){const i=$('#newProfName');if(i){i.placeholder='이름을 적어 주세요';i.focus();}break;}
        const id=addProfile(v);if(id){setKid(id);play('start');toGrades();}
        break;
      }
      case 'addProf':{
        const v=(($('#pNewName')||{}).value||'').trim().slice(0,10);
        if(!v){const i=$('#pNewName');if(i){i.placeholder='이름을 적어 주세요';i.focus();}break;}
        const id=addProfile(v);if(id){loadProfile(id);S.ptab='set';renderParent();}
        break;
      }
      case 'delProf':{
        if(!SYNC.admin||PROF.o.length<2)break;
        if(!S.delArm){S.delArm=PID;renderParent();break;}
        S.delArm='';const gone=PID;
        delete PROF.list[gone];PROF.o=PROF.o.filter(x=>x!==gone);saveProf();
        if(KIDP===gone){KIDP=PROF.o[0];try{localStorage.setItem(ACTK,KIDP);}catch(x){}}
        loadProfile(PROF.o[0]);renderParent();break;
      }
      case 'changeGrade':closeSheet();play('tap');toGrades();break;
      case 'toIntro':play('back');toIntro();break;
      case 'sheet':play('tap');openSheet();break;
      case 'closeSheet':closeSheet();break;
      case 'toParent':closeSheet();location.hash='parent';break;
      case 'pExit':location.hash='';if(document.body.dataset.screen==='parent'){leaveParent();}break;
      case 'sfx':PREF.sfx=!PREF.sfx;savePref();renderSheet();play('tap');break;
      case 'bgm':PREF.bgm=!PREF.bgm;savePref();if(PREF.bgm)bgmStart();else bgmStop();renderSheet();break;
      case 'hw':startHomework();break;
      case 'nextStage':startHomework();break;
      case 'goToday':setTab('today');break;
      case 'hint':{const p=S.probs[S.i];play('tap');$('#hintbox').innerHTML=`<p class="hinttext"><b>힌트</b> ${p.hint}</p>`;break;}
      case 'next':next();break;
      case 'quit':play('back');enterApp();break;
      case 'resHome':enterApp('today');break;
      case 'resCal':enterApp('cal');break;
      case 'again':startUnit(S.unit.id);break;
      case 'toList':enterApp('practice');break;
      case 'pGate':{
        const v=($('#pGateIn')||{}).value||'';
        if(hashPin(v)===CFG.pin){PUN=true;try{sessionStorage.setItem('semsem-pu','1');}catch(x){}renderParent();}
        else{$('#pGateMsg').textContent='번호가 달라요. 다시 입력해 주세요.';}
        break;
      }
      case 'pmore':{
        if(CFG.units[t.dataset.u]==='more')delete CFG.units[t.dataset.u];else CFG.units[t.dataset.u]='more';
        cfgChanged();break;
      }
      case 'pinSave':{
        const v=($('#pPinIn')||{}).value||'';
        if(/^\d{4}$/.test(v)){CFG.pin=hashPin(v);PUN=true;try{sessionStorage.setItem('semsem-pu','1');}catch(x){}cfgChanged();}
        else alertInline('번호는 숫자 4자리로 입력해 주세요.');
        break;
      }
      case 'pinOff':CFG.pin='';cfgChanged();break;
      case 'redeem':{
        if(!S.arm){S.arm=true;play('tap');renderApp();setTimeout(()=>{if(S.arm){S.arm=false;if(!$('#app').hidden&&S.tab==='reward')renderApp();}},3500);break;}
        S.arm=false;
        if(DB.goal.name.trim()&&balance()>=DB.goal.cost){
          DB.spent+=DB.goal.cost;DB.redeemed.unshift({n:DB.goal.name.trim(),d:todayKey(),c:DB.goal.cost});DB.redeemed=DB.redeemed.slice(0,20);
          save();play('sticker');
        }
        renderApp();break;
      }
    }
  }
});
function alertInline(msg){const b=document.querySelector('#pPinIn');if(b){b.placeholder=msg;b.value='';b.focus();}}
document.addEventListener('input',e=>{
  if(e.target.id==='goalName'){DB.goal.name=e.target.value.slice(0,24);S.arm=false;save();}
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='avFile'){
    const f=e.target.files&&e.target.files[0];if(!f||!SYNC.admin)return;
    if(!/^image\//.test(f.type)){S.avMsg='이미지 파일을 골라 주세요.';renderParent();return;}
    S.avMsg='사진을 줄이는 중…';const m=$('#avMsg');if(m)m.textContent=S.avMsg;
    photoToDataURL(f).then(url=>{setAvatar(PID,'p',url);S.avMsg='';renderParent();}).catch(()=>{S.avMsg='이 사진은 쓸 수 없어요. 다른 사진을 골라 주세요.';renderParent();});
    return;
  }
  if(id==='goalCost'){DB.goal.cost=+e.target.value;S.arm=false;save();renderApp();}
  else if(id==='pName'&&SYNC.admin){const v=e.target.value.trim().slice(0,10);PROF.list[PID]=Object.assign({},PROF.list[PID],{n:v});saveProf();renderParent();}
  else if(id==='pPace'){CFG.pace=e.target.value;cfgChanged();}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#stk')&&!$('#stk').hidden){closeStk();return;}
  if(e.key==='Escape'&&!$('#sheet').hidden){closeSheet();return;}
  if(e.key==='Enter'&&e.target&&e.target.id==='pGateIn'){e.preventDefault();const b=document.querySelector('[data-act="pGate"]');if(b)b.click();return;}
  if($('#play').hidden||!$('#sheet').hidden)return;
  if(e.key>='0'&&e.key<='9'&&!e.ctrlKey&&!e.metaKey){press(e.key);}
  else if(e.key==='Backspace'){e.preventDefault();back();}
  else if(e.key==='Enter'){
    if(e.target.closest&&e.target.closest('#nextbar'))return;
    e.preventDefault();
    if(S.done)next();
    else if(S.slots.length&&S.slots.every(x=>x))submit(S.slots.join(''));
  }
});
window.addEventListener('pagehide',()=>{if(SYNC.db&&SYNC.canWrite)flush();});
if(!route()){renderIntro();show('intro');}
initShared().then(()=>{if(!SYNC.db&&gh())ghSync(false);});
</script>
