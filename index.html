<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>셈셈 수학 놀이터</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700&display=swap">
<style>
/* Layout concept: 모눈 연습장 위에 스티커처럼 붙은 두꺼운 외곽선 카드. 홈(학년·단원) → 풀이(키패드) → 결과 */
:root{
  --paper:#F2F8FF; --grid:#D9E8F8; --card:#FFFFFF;
  --ink:#1B2744; --soft:#566685; --edge:#1B2744; --shadow:#1B2744;
  --sun:#FFC93C; --mint:#37C9A0; --sky:#52A8FF; --coral:#FF6F61;
  --sun-t:#FFF1C2; --mint-t:#D3F5E9; --sky-t:#D6EAFF; --coral-t:#FFDAD6;
  --op:#E0463A; --ok:#12805A; --bad:#C23A30; --on:#1B2744;
  --font-d:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-b:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111A2E; --grid:#1A2640; --card:#1B2742;
    --ink:#EAF0FF; --soft:#A3B3D6; --edge:#8EA5D9; --shadow:#060B16;
    --sun-t:#4A3F17; --mint-t:#16443A; --sky-t:#173A63; --coral-t:#4F2523;
    --op:#FF8A80; --ok:#4BDBA6; --bad:#FF8A80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111A2E; --grid:#1A2640; --card:#1B2742;
  --ink:#EAF0FF; --soft:#A3B3D6; --edge:#8EA5D9; --shadow:#060B16;
  --sun-t:#4A3F17; --mint-t:#16443A; --sky-t:#173A63; --coral-t:#4F2523;
  --op:#FF8A80; --ok:#4BDBA6; --bad:#FF8A80; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; color:var(--ink); font-family:var(--font-b); font-size:16px; line-height:1.5;
  background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
}
button{font-family:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--sky); outline-offset:3px}
.wrap{
  max-width:720px; margin:0 auto; padding-block:18px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.screen{animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* mascot */
.mascot{width:72px;height:72px;flex:none;overflow:visible}
.mascot .m-line{stroke:var(--edge);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.mascot .m-body{fill:var(--sky)}
.mascot .m-ball{fill:var(--sun)}
.mascot .m-cheek{fill:var(--coral);opacity:.75}
.mascot .m-eye{fill:var(--on)}
.mascot .m-mouth{fill:none;stroke:var(--on);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.mascot .m-open{fill:var(--coral)}
.mascot .happy-only,.mascot .sad-only{display:none}
.mascot.happy .happy-only{display:inline}
.mascot.happy .calm-only{display:none}
.mascot.sad .sad-only{display:inline}
.mascot.sad .calm-only{display:none}
.mascot.happy{animation:hop .5s ease-out}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-12px)}100%{transform:translateY(0)}}

/* home */
.head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.head h1{font:2.1rem/1.1 var(--font-d);margin:0;text-wrap:balance}
.head p{margin:2px 0 0;color:var(--soft);font-size:.9rem}
.total{margin-left:auto;flex:none;border:3px solid var(--edge);border-radius:999px;background:var(--sun);color:var(--on);
  font:1.1rem/1 var(--font-d);padding:8px 14px;box-shadow:0 3px 0 var(--shadow);white-space:nowrap}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tab{border:3px solid var(--edge);border-radius:20px;background:var(--card);box-shadow:0 5px 0 var(--shadow);
  padding:8px 4px 10px;display:flex;align-items:baseline;justify-content:center;gap:2px;transition:transform .08s,box-shadow .08s}
.tab b{font:2.4rem/1 var(--font-d)}
.tab span{font:1.05rem/1 var(--font-d)}
.tab.on{transform:translateY(3px);box-shadow:0 2px 0 var(--shadow);color:var(--on)}
.g1{--gc:var(--sun);--gt:var(--sun-t)}
.g2{--gc:var(--mint);--gt:var(--mint-t)}
.g3{--gc:var(--sky);--gt:var(--sky-t)}
.tab.on{background:var(--gc)}
.gdesc{margin:14px 2px 4px;color:var(--soft);font-size:.95rem}
.nsel{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:12px 2px 0}
.nsel>span{font:1rem/1 var(--font-d);margin-right:2px}
.nbtn{border:3px solid var(--edge);border-radius:999px;background:var(--card);box-shadow:0 3px 0 var(--shadow);padding:5px 14px;font:1rem/1.3 var(--font-d);color:var(--ink)}
.nbtn.on{background:var(--gc);color:var(--on);transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.bar{flex:1;height:16px;border:2.5px solid var(--edge);border-radius:9px;background:var(--card);overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint);transition:width .3s}
.gh{font:1.05rem/1 var(--font-d);letter-spacing:.06em;margin:22px 2px 10px;display:flex;align-items:center;gap:10px}
.gh::after{content:"";flex:1;height:3px;border-radius:2px;background:var(--grid);background:repeating-linear-gradient(90deg,var(--edge) 0 6px,transparent 6px 12px);opacity:.35}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.ucard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;text-align:left;
  border:3px solid var(--edge);border-radius:20px;background:var(--card);box-shadow:0 5px 0 var(--shadow);padding:12px;
  transition:transform .08s,box-shadow .08s}
.ucard:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shadow)}
.badge{width:54px;height:54px;border:3px solid var(--edge);border-radius:50%;background:var(--gc);color:var(--on);
  display:grid;place-items:center;font:1.7rem/1 var(--font-d)}
.badge.sm{font-size:1.15rem}
.uname{font:1.15rem/1.2 var(--font-d);display:block}
.uex{display:block;color:var(--soft);font-size:.85rem}
.ustars{display:block;margin-top:2px;letter-spacing:.1em;font-size:1rem;line-height:1}
.ustars i{font-style:normal;color:var(--grid);-webkit-text-stroke:1px var(--edge)}
.ustars i.on{color:var(--sun)}
.note{margin:26px 2px 0;color:var(--soft);font-size:.85rem;text-align:center}

/* play */
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.quit{border:3px solid var(--edge);border-radius:14px;background:var(--card);box-shadow:0 3px 0 var(--shadow);padding:6px 12px;font:.95rem/1.2 var(--font-d);white-space:nowrap}
.prog{flex:1;display:flex;gap:4px;min-width:0}
.seg{flex:1;height:14px;border:2.5px solid var(--edge);border-radius:8px;background:var(--card)}
.seg.ok{background:var(--mint)}
.seg.mid{background:var(--sun)}
.seg.bad{background:var(--coral)}
.seg.now{background:var(--sky-t);box-shadow:0 0 0 3px var(--sky)}
.count{font:1rem/1 var(--font-d);white-space:nowrap}
.talk{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bubble{position:relative;flex:1;min-width:0;border:3px solid var(--edge);border-radius:18px;background:var(--card);padding:10px 14px;
  font:1.1rem/1.35 var(--font-d);box-shadow:0 4px 0 var(--shadow)}
.bubble::before{content:"";position:absolute;left:-11px;top:50%;width:16px;height:16px;background:var(--card);
  border-left:3px solid var(--edge);border-bottom:3px solid var(--edge);transform:translateY(-50%) rotate(45deg)}
.stage{border:3px solid var(--edge);border-radius:24px;background:var(--card);box-shadow:0 6px 0 var(--shadow);
  padding:22px 12px;text-align:center;min-height:190px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px}
.expr{font:clamp(2rem,9.5vw,2.9rem)/1.5 var(--font-d);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:0 .2em}
.expr .op{color:var(--op)}
.slots{display:inline-flex;gap:6px;vertical-align:middle}
.slot{width:1.45em;height:1.65em;border:3px dashed var(--edge);border-radius:12px;background:var(--card);color:var(--ink);
  font:inherit;padding:0;display:inline-grid;place-items:center;line-height:1}
.slot.active{border-style:solid;background:var(--sun-t);box-shadow:0 0 0 3px var(--sun)}
.slot.ok{border-style:solid;background:var(--mint-t);box-shadow:none}
.slot.reveal{border-style:solid;background:var(--sun-t);box-shadow:none}
.slot.bad{border-style:solid;background:var(--coral-t);box-shadow:none;animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.objs{display:grid;grid-template-columns:repeat(5,minmax(0,2.5rem));gap:4px;justify-content:center;font-size:clamp(1.5rem,7vw,2rem);line-height:1.2}
.pie{width:min(150px,44vw);height:auto}
.pie path{stroke:var(--edge);stroke-width:3;stroke-linejoin:round}
.pie .pf{fill:var(--coral)} .pie .pe{fill:var(--card)}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 .15em}
.frac>span:first-child{border-bottom:4px solid currentColor;padding:0 .2em .08em;min-width:1em;display:flex;justify-content:center}
.frac>span:last-child{padding-top:.08em}
.frac .slot{font-size:.8em}
.vgrid{--cw:clamp(2.7rem,12vw,3.6rem);display:grid;grid-template-columns:repeat(calc(var(--n) + 1),var(--cw));gap:6px;justify-content:center;font:calc(var(--cw)*.78)/1 var(--font-d)}
.vc{height:var(--cw);display:flex;align-items:center;justify-content:center}
.vc.op{color:var(--op)}
.vline{grid-column:1/-1;height:5px;border-radius:3px;background:var(--ink);margin:2px 0}
.vgrid .slot{width:100%;height:var(--cw);font-size:inherit}
.cmp{display:flex;align-items:center;justify-content:center;gap:14px;font:clamp(2.2rem,11vw,3.4rem)/1.2 var(--font-d)}
.cmp .mid{width:1.3em;height:1.3em;border:3px dashed var(--edge);border-radius:50%;display:grid;place-items:center;color:var(--soft)}
.cmp .mid.done{border-style:solid;background:var(--mint-t);color:var(--ink)}
.mq{font:700 1.2rem/1.65 var(--font-b);max-width:30em;text-wrap:pretty}
.seq{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;font:clamp(1.7rem,8vw,2.4rem)/1.2 var(--font-d)}
.seq span{min-width:1.7em;padding:2px 6px;border:3px solid var(--edge);border-radius:12px;background:var(--paper)}
.seq .q{border-style:dashed;background:var(--sun-t);color:var(--op)}
.eq{font:clamp(2rem,9vw,2.7rem)/1.3 var(--font-d);padding:6px 16px;border:3px dashed var(--edge);border-radius:16px;background:var(--paper)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px;margin-top:18px}
.opt{display:flex;align-items:center;gap:12px;border:3px solid var(--edge);border-radius:16px;background:var(--card);box-shadow:0 4px 0 var(--shadow);
  padding:8px 14px;font:1.45rem/1.2 var(--font-d);color:var(--ink);text-align:left;min-height:54px}
.opt b{flex:none;width:2.1rem;height:2.1rem;border:2.5px solid var(--edge);border-radius:50%;background:var(--sky-t);display:grid;place-items:center;font:1rem/1 var(--font-d)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.opt.bad{background:var(--coral-t);opacity:.6}
.opt.ok{background:var(--mint-t)}
.opt:disabled,.choice:disabled{color:var(--ink)}
.shp{width:min(140px,40vw);height:auto}
.shp polygon,.shp rect,.shp circle{fill:var(--sky-t);stroke:var(--edge);stroke-width:4;stroke-linejoin:round}
.fig{width:min(270px,78vw);height:auto}
.fig rect,.fig circle{fill:var(--sky-t);stroke:var(--edge);stroke-width:4}
.fig line{stroke:var(--op);stroke-width:4;stroke-linecap:round}
.fig circle.dot{fill:var(--op);stroke:none}
.fig text{font:700 16px var(--font-b);fill:var(--ink)}
.shapes{display:grid;grid-template-columns:repeat(6,minmax(0,42px));gap:8px;justify-content:center}
.mini{width:100%;height:auto}
.mini *{stroke:var(--edge);stroke-width:2.5;stroke-linejoin:round}
.mini .c{fill:var(--coral)}.mini .t{fill:var(--sun)}.mini .s{fill:var(--mint)}
.balls{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:22em;padding:10px 14px 12px;border:3px dashed var(--edge);border-radius:22px;background:var(--paper);font-size:2rem;line-height:1.15}
.balls small{flex:0 0 100%;font:700 .8rem/1.2 var(--font-b);color:var(--soft);margin-bottom:2px}
.tbl{border-collapse:separate;border-spacing:6px;font:1.6rem/1 var(--font-d)}
.tbl th{font:700 .95rem/1 var(--font-b);color:var(--soft);padding-right:6px}
.tbl td{min-width:2.3em;padding:10px 6px;border:3px solid var(--edge);border-radius:12px;background:var(--paper)}
.tbl td.q{border-style:dashed;background:var(--sun-t);color:var(--op)}
.bars{display:flex;gap:12px;align-items:flex-end;justify-content:center;min-height:130px}
.bar1{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font:1.1rem/1 var(--font-d)}
.bar1 i{display:block;width:34px;border:3px solid var(--edge);border-radius:8px 8px 0 0;background:var(--mint)}
.hintbox{margin-top:12px;min-height:0}
.hintbtn{border:3px solid var(--edge);border-radius:999px;background:var(--sky-t);box-shadow:0 3px 0 var(--shadow);padding:4px 16px;font:.95rem/1.5 var(--font-d)}
.hinttext{margin:10px 0 0;border:3px dashed var(--edge);border-radius:16px;background:var(--sun-t);padding:10px 14px;text-align:left;font-size:.95rem}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:360px;margin:18px auto 0}
.key{height:58px;border:3px solid var(--edge);border-radius:16px;background:var(--card);box-shadow:0 4px 0 var(--shadow);font:1.7rem/1 var(--font-d);color:var(--ink)}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.key.bk{background:var(--coral-t);font-size:1.3rem}
.key.go{background:var(--mint);color:var(--on);font-size:1.3rem}
.key:disabled{opacity:.4;box-shadow:0 4px 0 var(--shadow)}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.choice{border:3px solid var(--edge);border-radius:18px;background:var(--card);box-shadow:0 4px 0 var(--shadow);padding:10px 4px;
  display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink)}
.choice b{font:2.4rem/1.1 var(--font-d)}
.choice small{font-size:.8rem;color:var(--soft)}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.choice.bad{background:var(--coral-t);opacity:.6}
.choice.ok{background:var(--mint-t)}
.nextbar{margin-top:18px;display:flex;justify-content:center}
.big{border:3px solid var(--edge);border-radius:18px;background:var(--mint);color:var(--on);box-shadow:0 5px 0 var(--shadow);
  padding:12px 32px;font:1.35rem/1.2 var(--font-d);min-width:min(100%,240px)}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shadow)}
.big.alt{background:var(--card);color:var(--ink)}

/* result */
.rcard{position:relative;overflow:hidden;border:3px solid var(--edge);border-radius:28px;background:var(--card);box-shadow:0 6px 0 var(--shadow);
  padding:26px 16px 22px;text-align:center}
.rcard .mascot{width:104px;height:104px;margin:0 auto}
.rcard h2{font:1.9rem/1.2 var(--font-d);margin:8px 0 4px;text-wrap:balance}
.rstars{display:flex;justify-content:center;gap:6px;font-size:3.2rem;line-height:1;margin:6px 0}
.rstars i{font-style:normal;color:var(--grid);-webkit-text-stroke:2px var(--edge)}
.rstars i.on{color:var(--sun);animation:pop .5s backwards}
.rstars i:nth-child(2){animation-delay:.2s}.rstars i:nth-child(3){animation-delay:.4s}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3)}100%{transform:none}}
.rsum{color:var(--soft);margin:0}
.review{list-style:none;margin:16px auto 0;padding:0;max-width:420px;text-align:left;display:grid;gap:6px}
.review li{display:flex;justify-content:space-between;gap:10px;border:2.5px solid var(--edge);border-radius:12px;padding:6px 12px;background:var(--paper);font:1.05rem/1.4 var(--font-d)}
.review em{font:normal .8rem/1.9 var(--font-b);color:var(--soft);white-space:nowrap}
.rbtns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:20px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:10px;height:14px;border-radius:3px;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(520px) rotate(540deg);opacity:.9}}
@media (prefers-reduced-motion:reduce){
  .screen,.mascot.happy,.slot.bad,.rstars i.on,.confetti i{animation:none}
}
</style>

<div class="wrap">
  <main id="home" class="screen">
    <header class="head">
      <span id="homeMascot"></span>
      <div>
        <h1>셈셈 수학 놀이터</h1>
        <p>학년과 단원, 문제 수를 골라 풀어요</p>
      </div>
      <div class="total" aria-label="모은 별">★ <span id="total">0</span></div>
    </header>
    <div class="tabs" id="tabs"></div>
    <p class="gdesc" id="gdesc"></p>
    <div class="nsel" id="nsel"></div>
    <div id="units"></div>
    <p class="note">문제는 풀 때마다 새로 만들어져요. 별은 이 기기에 저장돼요.</p>
  </main>

  <section id="play" class="screen" hidden>
    <div class="top">
      <button class="quit" id="quit" type="button">← 나가기</button>
      <div class="prog" id="prog" aria-hidden="true"></div>
      <div class="count" id="count"></div>
    </div>
    <div class="talk">
      <span id="playMascot"></span>
      <div class="bubble" id="bubble" aria-live="polite"></div>
    </div>
    <div class="stage" id="stage"></div>
    <div class="hintbox" id="hintbox"></div>
    <div id="inputArea"></div>
    <div class="nextbar" id="nextbar" hidden><button class="big" id="nextBtn" type="button">다음 문제 →</button></div>
  </section>

  <section id="result" class="screen" hidden></section>
</div>

<script>
/* ============ 문제 생성 ============ */
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[R(0,a.length-1)];
const find=(gen,ok)=>{let p;for(let i=0;i<400;i++){p=gen();if(ok(p))return p;}return p;};
const carryAdd=(a,b)=>{let c=0;while(a>0||b>0||c>0){const s=a%10+b%10+c;if(s>=10)return true;c=0;a=Math.floor(a/10);b=Math.floor(b/10);}return false;};
const borrow=(a,b)=>{while(b>0){if(a%10<b%10)return true;a=Math.floor(a/10);b=Math.floor(b/10);}return false;};
const EMO=['🍎','⭐','🐟','🍓','🐥','🍪','🎈','🚗'];
const frac=(n,d)=>`<span class="frac"><span>${n}</span><span>${d}</span></span>`;
const strip=s=>s.replace(/<[^>]+>/g,'');
const H=(tpl,ans,o={})=>({layout:'h',tpl,ans,hint:o.hint||'',visual:o.visual||'',sum:o.sum||strip(tpl.replace('{S}',ans))});
const V=(a,op,b,ans,hint)=>({layout:'v',a,op,b,ans,hint,sum:`${a} ${op} ${b} = ${ans}`});
const C=(l,r,ans,sum,hint)=>({layout:'c',l,r,ans,hint,sum});
function pie(total,k){
  const r=62,c=70;let s='';
  for(let i=0;i<total;i++){
    const a0=-Math.PI/2+i*2*Math.PI/total,a1=-Math.PI/2+(i+1)*2*Math.PI/total;
    s+=`<path class="${i<k?'pf':'pe'}" d="M${c} ${c}L${(c+r*Math.cos(a0)).toFixed(1)} ${(c+r*Math.sin(a0)).toFixed(1)}A${r} ${r} 0 0 1 ${(c+r*Math.cos(a1)).toFixed(1)} ${(c+r*Math.sin(a1)).toFixed(1)}Z"/>`;
  }
  return `<svg class="pie" viewBox="0 0 140 140" role="img" aria-label="${total}조각 중 ${k}조각 색칠">${s}</svg>`;
}

};

function buildSet(u,n=10){
  const out=[],seen=new Set();
  for(let i=0;i<800&&out.length<n;i++){const p=u.gen(),k=p.key||p.sum;if(!seen.has(k)){seen.add(k);out.push(p);}}
  while(out.length<n)out.push(u.gen());
  return out;
}

  }else if(p.layout==='v'){
    const A=String(p.a),B=String(p.b),cols=Math.max(A.length,B.length,n);
    const row=s=>Array.from({length:cols},(_,i)=>{const j=i-(cols-s.length);return `<span class="vc">${j>=0?s[j]:''}</span>`;}).join('');
    const ansRow=Array.from({length:cols},(_,i)=>i<cols-n?'<span class="vc"></span>':slotBtn(i-(cols-n))).join('');
    body=`<div class="vgrid" style="--n:${cols}"><span class="vc"></span>${row(A)}<span class="vc op">${p.op}</span>${row(B)}<span class="vline"></span><span class="vc"></span>${ansRow}</div>`;
  }else if(p.layout==='m'){
    body=`<div class="mq">${p.q}</div>${p.visual}`;
  }else{
    body=`<div class="cmp"><span>${p.l}</span><span class="mid" id="mid">?</span><span>${p.r}</span></div>`;
  }
  $('#stage').innerHTML=body;
  $('#hintbox').innerHTML=p.hint?`<button type="button" class="hintbtn" id="hintBtn">힌트 보기</button>`:'';
  $('#inputArea').innerHTML=p.layout==='m'?`<div class="opts">${p.opts.map((o,i)=>`<button type="button" class="opt" data-v="${o}"><b>${circ[i]}</b><span>${/^\d+\/\d+$/.test(o)?frac(...o.split('/')):o}</span></button>`).join('')}</div>`:p.layout==='c'
    ?`<div class="choices">${[['>','왼쪽이 커요'],['=','같아요'],['<','오른쪽이 커요']].map(([s,t])=>`<button type="button" class="choice" data-v="${s}"><b>${s==='>'?'&gt;':s==='<'?'&lt;':s}</b><small>${t}</small></button>`).join('')}</div>`
    :`<div class="keypad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button type="button" class="key" data-k="${d}">${d}</button>`).join('')}<button type="button" class="key bk" data-k="bk" aria-label="지우기">⌫ 지우기</button><button type="button" class="key" data-k="0">0</button><button type="button" class="key go" data-k="ok" id="okKey">확인</button></div>`;
  $('#nextbar').hidden=true;
  $('#bubble').textContent=S.unit.q;
  $('#playMascot').innerHTML=mascot();
  renderProgress();paint();
}
function paint(){
  document.querySelectorAll('#stage .slot').forEach((el,i)=>{
    el.textContent=S.slots[i]||'';
    el.classList.toggle('active',!S.locked&&i===S.cur);
  });
  const ok=$('#okKey');
  if(ok)ok.disabled=S.locked||!S.slots.length||S.slots.some(x=>!x);
}
function press(d){
  if(S.locked||!S.slots.length)return;
  S.slots[S.cur]=d;
  const nx=S.cur+S.step;if(nx>=0&&nx<S.slots.length)S.cur=nx;
  paint();
}
function back(){
  if(S.locked||!S.slots.length)return;
  if(S.slots[S.cur])S.slots[S.cur]='';
  else{const pv=S.cur-S.step;if(pv>=0&&pv<S.slots.length){S.cur=pv;S.slots[pv]='';}}
  paint();
}
const PRAISE=['정답이에요!','잘했어요!','대단해요!','멋져요!','최고예요!','딱 맞았어요!'];
const RETRY=['앗, 다시 한 번 해볼까요?','거의 다 왔어요! 한 번 더!','괜찮아요, 천천히 다시!'];
function submit(val){
  if(S.locked||S.done)return;
  const p=S.probs[S.i];
  if(String(val)===String(p.ans)){
    S.res[S.i]=S.tries===0?'first':'second';
    settle('ok');
  }else{
    S.tries++;
    if(S.tries>=2){S.res[S.i]='fail';settle('reveal');}
    else wrong(val);
  }
}
function wrong(val){
  const p=S.probs[S.i];
  S.locked=true;
  $('#bubble').textContent=pick(RETRY);mood($('#playMascot'),'sad');
  if(p.layout==='c'||p.layout==='m'){
    const wb=document.querySelector(`#inputArea [data-v="${val}"]`);
    wb?.classList.add('bad');wb?.setAttribute('disabled','');
    setTimeout(()=>{S.locked=false;},350);
  }else{
    document.querySelectorAll('#stage .slot').forEach(el=>el.classList.add('bad'));
    paint();
    setTimeout(()=>{
      S.slots=S.slots.map(()=>'');S.cur=S.step<0?S.slots.length-1:0;S.locked=false;
      document.querySelectorAll('#stage .slot').forEach(el=>el.classList.remove('bad'));
      paint();
    },750);
  }
}
function settle(kind){
  const p=S.probs[S.i];
  S.locked=true;S.done=true;
  if(p.layout==='c'||p.layout==='m'){
    if(p.layout==='c'){const mid=$('#mid');mid.textContent=p.ans;mid.classList.add('done');}
    document.querySelectorAll('#inputArea [data-v]').forEach(b=>{b.setAttribute('disabled','');if(b.dataset.v===p.ans)b.classList.add('ok');});
  }else{
    if(kind==='reveal')S.slots=String(p.ans).split('');
    document.querySelectorAll('#stage .slot').forEach(el=>{el.classList.remove('active','bad');el.classList.add(kind==='ok'?'ok':'reveal');});
    paint();
    document.querySelectorAll('#stage .slot').forEach(el=>el.classList.remove('active'));
    $('#inputArea').innerHTML='';
  }
  if(p.layout==='c')$('#inputArea').querySelectorAll('.choice').forEach(b=>b.blur());
  $('#bubble').textContent=kind==='ok'?pick(PRAISE):`정답은 ${p.layout==='m'?p.ansText:p.ans}이에요. 다음엔 맞힐 수 있어요!`;
  mood($('#playMascot'),kind==='ok'?'happy':'sad');
  $('#nextBtn').textContent=S.i===S.probs.length-1?'결과 보기 →':'다음 문제 →';
  $('#nextbar').hidden=false;
  renderProgress();
  $('#nextBtn').focus({preventScroll:true});
}
function next(){
  if(S.i>=S.probs.length-1)return finish();
  S.i++;renderProblem();
}

/* ---- 결과 ---- */
function finish(){
  const f=S.res.filter(r=>r==='first').length,s2=S.res.filter(r=>r==='second').length;
  const pr=(f+s2*.5)/S.probs.length,stars=pr>=.9?3:pr>=.7?2:pr>=.5?1:0;
  saveStar(S.unit.id,stars);
  const msg=['괜찮아요. 다시 도전해 봐요!','좋아요! 조금만 더 연습해요.','아주 잘했어요!','완벽해요! 수학 박사님!'][stars];
  const miss=S.probs.map((p,i)=>({p,r:S.res[i]})).filter(x=>x.r!=='first');
  $('#result').innerHTML=`<div class="rcard g${S.unit.g}">
    <div class="confetti" id="confetti" aria-hidden="true"></div>
    <div id="rMascot"></div>
    <h2>${msg}</h2>
    <div class="rstars" aria-label="별 ${stars}개">${[1,2,3].map(i=>`<i class="${i<=stars?'on':''}">★</i>`).join('')}</div>
    <p class="rsum">${S.unit.name} · 한 번에 맞힌 문제 ${f} / ${S.probs.length}${s2?` · 다시 풀어서 맞힌 문제 ${s2}`:''}</p>
    ${miss.length?`<ul class="review" aria-label="다시 볼 문제">${miss.map(x=>`<li><span>${x.p.sum}</span><em>${x.r==='second'?'다시 풀어서 맞힘':'정답 확인'}</em></li>`).join('')}</ul>`:''}
    <div class="rbtns"><button type="button" class="big" id="again">한 번 더 풀기</button><button type="button" class="big alt" id="toHome">단원 고르기</button></div>
  </div>`;
  show('result');
  $('#rMascot').innerHTML=mascot();mood($('#rMascot'),stars>=2?'happy':stars===0?'sad':'');
  if(stars>=2){
    const cols=['var(--sun)','var(--mint)','var(--sky)','var(--coral)'];
    $('#confetti').innerHTML=Array.from({length:30},(_,i)=>`<i style="left:${R(2,98)}%;background:${cols[i%4]};animation-delay:${(Math.random()*.9).toFixed(2)}s"></i>`).join('');
  }
}

/* ---- 이벤트 ---- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.tab){S.grade=+t.dataset.tab;renderHome();}
  else if(t.dataset.n){S.n=+t.dataset.n;renderHome();}
  else if(t.dataset.unit)startUnit(t.dataset.unit);
  else if(t.dataset.k!==undefined){
    const k=t.dataset.k;
    if(k==='bk')back();else if(k==='ok'){if(!t.disabled)submit(S.slots.join(''));}else press(k);
  }
  else if(t.dataset.i!==undefined){if(!S.locked){S.cur=+t.dataset.i;paint();}}
  else if(t.dataset.v)submit(t.dataset.v);
  else if(t.id==='hintBtn'){
    const p=S.probs[S.i];
    $('#hintbox').innerHTML=`<p class="hinttext"><b>힌트</b> ${p.hint}</p>`;
  }
  else if(t.id==='nextBtn')next();
  else if(t.id==='quit'||t.id==='toHome'){renderHome();show('home');}
  else if(t.id==='again')startUnit(S.unit.id);
});
document.addEventListener('keydown',e=>{
  if($('#play').hidden)return;
  if(e.key>='0'&&e.key<='9'&&!e.ctrlKey&&!e.metaKey){press(e.key);}
  else if(e.key==='Backspace'){e.preventDefault();back();}
  else if(e.key==='Enter'){
    if(e.target.closest&&e.target.closest('#nextbar'))return;
    e.preventDefault();
    if(S.done)next();
    else if(S.slots.length&&S.slots.every(x=>x))submit(S.slots.join(''));
  }
});
$('#homeMascot').innerHTML=mascot();
renderHome();
</script>

</body></html>
